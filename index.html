<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#16121c">

<title>L'Ultimo Passo — prototipo</title>
<style>
:root{--bg:#16121c;--panel:#241e2c;--panel2:#2e2738;--ink:#ece3c8;--dim:#8f8572;--red:#e0483a;--amber:#e8a838;--green:#86b85e;--blue:#5a9ad8}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
html,body{margin:0;height:100%;background:#000;color:var(--ink);font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;overflow:hidden;touch-action:none;overscroll-behavior:none}
#app{position:relative;height:100vh;height:100dvh;display:flex;flex-direction:column;overflow:hidden;background:var(--bg);padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
#stage{position:relative;flex:1;min-height:0}
#cdn{display:none;top:42%!important;transition:none!important;transform:translate(-50%,-50%);z-index:3;pointer-events:none}
#cdn.pop{animation:cdpop .9s steps(6,end)}
@keyframes cdpop{0%{transform:translate(-50%,-50%) scale(1.3);opacity:1}70%{opacity:1}100%{transform:translate(-50%,-50%) scale(1);opacity:.15}}
#blackout{position:absolute;inset:0;background:#000;z-index:50;pointer-events:none;opacity:0;transition:opacity .6s}
#blackout.on{opacity:1}
#screen.ldsc{background:#0a080c}
.ldg{display:flex;flex-direction:column;align-items:center;gap:12px}
.ldt{font-size:14px;letter-spacing:4px;color:var(--amber);animation:blink 1s steps(2) infinite}
.ldtip{font-size:15px;max-width:520px;margin:14px 0 0;line-height:1.4;color:var(--ink)}
.ldb{width:220px;height:14px;border:2px solid #4a405a;background:#14101a;padding:2px}.ldb b{display:block;height:100%;width:0;background:var(--amber)}
#vig{position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none;z-index:1;opacity:0;background:radial-gradient(ellipse at center,rgba(0,0,0,0) 45%,rgba(150,0,0,.55) 100%)}
#fx{position:absolute;left:0;top:0;width:100%;height:100%;image-rendering:pixelated;pointer-events:none;z-index:1}
#chatd{position:absolute;display:none;transform:translate(-50%,-100%);background:#f4f4f0;color:#7a0a0a;border:2px solid #000;padding:3px 6px;font-size:10px;font-style:italic;pointer-events:none;z-index:2;box-shadow:2px 2px 0 #000;white-space:nowrap}
#chatd:after{content:'';position:absolute;left:50%;bottom:-6px;margin-left:-3px;border:3px solid transparent;border-top-color:#000}
#chatb.shout{font-weight:800;color:#7a0a0a;font-size:11px}
#chatb{position:absolute;display:none;transform:translate(-50%,-100%);background:#f4f4f0;color:#111;border:2px solid #000;padding:3px 6px;font-size:10px;line-height:1.25;max-width:170px;text-align:center;pointer-events:none;z-index:2;box-shadow:2px 2px 0 #000}
#chatb:after{content:'';position:absolute;left:50%;bottom:-6px;margin-left:-3px;border:3px solid transparent;border-top-color:#000}
#scene{position:absolute;left:0;top:0;width:100%;height:100%;display:block;image-rendering:pixelated;image-rendering:crisp-edges;background:#000}
#hud{position:absolute;top:0;left:0;padding:4px 8px 5px;background:rgba(22,18,28,.82);border:2px solid #000;border-width:0 2px 2px 0;font-size:11px;width:min(300px,60%)}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.lbl{color:var(--dim)}
#warns{display:flex;gap:3px}
#warns i{width:11px;height:11px;border:2px solid var(--red);display:block}
#warns i.on{background:var(--red)}
.bars{display:grid;grid-template-columns:auto 1fr;gap:2px 6px;align-items:center;margin-top:4px;font-size:9px}
.bar{position:relative;height:7px;background:#0c0a10;border:2px solid #000}
.bar .fill{position:absolute;top:0;bottom:0;left:0}
.bar .cap{position:absolute;top:0;bottom:0;right:0;background:repeating-linear-gradient(45deg,#3a2f2a 0 3px,#1c1614 3px 6px)}
#alert{position:absolute;top:6px;right:8px;font-size:11px;font-weight:700;color:var(--amber);background:rgba(22,18,28,.75);padding:2px 6px}
#alert:empty{display:none}
#mute{background:none;border:0;box-shadow:none;padding:0 2px;font-size:13px}
#bottom{display:flex;height:31vh;min-height:92px;max-height:170px;gap:6px;padding:6px;flex:none;background:var(--bg);border-top:2px solid #000}
#center{flex:1.6;display:flex;flex-direction:column;gap:5px;min-width:0}
#log{flex:1;overflow:hidden;min-height:0}
#log div{font-size:11.5px;line-height:1.3;margin-bottom:2px}
#log div.th{font-style:italic}
#inv{display:flex;gap:4px;flex:none}
#inv button{flex:1;text-align:center;font-size:10.5px;padding:5px 2px;line-height:1.15}
.pad{flex:1;border:3px solid #000;background:var(--panel);display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:800;font-size:13px;color:var(--dim);touch-action:none}
.pad.next{background:#3a3248;color:var(--ink);box-shadow:inset 0 0 0 3px var(--amber)}
.pad.hit{background:#5a4e6a}.pad.bad{background:#5a1e1a}
.pad.rise,.pad.rise.next{background:#e0c040;color:#1a1410;box-shadow:inset 0 0 0 3px #fff3a0;animation:risep .5s steps(2) infinite}
@keyframes risep{50%{background:#b8901a}}.pad.rise.hit{background:#fff3a0}
.pad svg{width:30px;height:30px;margin-bottom:3px}
.box{position:absolute;top:6px;left:50%;transform:translateX(-50%);width:min(600px,94%);max-height:calc(100% - 12px);background:var(--panel2);border:2px solid #000;box-shadow:inset 0 0 0 2px #4a405a,0 4px 0 rgba(0,0,0,.5);padding:7px;display:flex;flex-direction:column;gap:5px;z-index:3}
.box .hd{display:flex;gap:8px;align-items:center;flex:none}
.box canvas{width:30px;height:30px;image-rendering:pixelated;border:2px solid #000;background:#3a3248;flex:none}
.box .nm{font-weight:800;font-size:13px}
.box .rl{font-size:11px;color:var(--dim)}
.box .tx{font-size:13px;line-height:1.3;flex:1 1 auto;min-height:16px;overflow:auto}
.box .tm{height:4px;background:#0c0a10;flex:none}
.box .tm b{display:block;height:100%;background:var(--amber)}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:4px;flex:none}
.opts button{padding:6px 8px;font-size:12px}
button{font:inherit;color:var(--ink);background:#3a3248;border:2px solid #000;box-shadow:inset 0 -3px 0 #231d2c;padding:8px;text-align:left;font-size:12.5px;cursor:pointer}
button:active{transform:translateY(1px);box-shadow:inset 0 -1px 0 #231d2c}
button:disabled{opacity:.35}
.qte{align-items:center;text-align:center}
.qte .tx{flex:none}
.qte .big{font-size:18px;font-weight:800;color:var(--amber)}
.qte button.main{text-align:center;font-size:16px;font-weight:800;background:var(--amber);color:#1a1410;padding:10px 22px}
.track{position:relative;width:80%;height:16px;background:#0c0a10;border:2px solid #000;flex:none}
.track .zone{position:absolute;top:0;bottom:0;background:var(--green)}
.track .mk{position:absolute;top:-4px;bottom:-4px;width:4px;background:var(--ink)}
/* schermate */
#screen{position:absolute;inset:0;background:rgba(14,10,18,.97);display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding:16px 22px;text-align:center;z-index:5;overflow:auto}
#screen h1{font-size:28px;letter-spacing:4px;margin:0 0 4px;color:var(--amber)}
#screen h2{font-size:12px;color:var(--dim);margin:0 0 12px;font-weight:400;letter-spacing:1px}
#screen p{font-size:13px;line-height:1.5;margin:0 0 10px;max-width:520px}
#screen button.main{text-align:center;background:var(--amber);color:#1a1410;font-weight:800;font-size:16px;padding:12px 26px}
#screen button.ghost{background:none;box-shadow:none;border:2px solid #4a405a;color:var(--dim);text-align:center;font-size:12px;padding:6px 14px}
#screen .choices{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:7px;width:100%;max-width:760px;margin-bottom:12px}
#screen .choices button{text-align:left;padding:9px}
#screen .choices button small{display:block;color:var(--dim);font-size:11px;margin-top:3px;line-height:1.35}
#screen .choices button.sel{box-shadow:inset 0 0 0 2px var(--amber)}
.tcol{position:absolute;z-index:5;left:calc(14px + env(safe-area-inset-left));bottom:calc(30px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:6px;align-items:flex-start}
.trbtn{padding:5px 10px;font-size:11px}
#screen.manual .mlist{max-width:680px;text-align:left;font-size:13px;line-height:1.5;margin:6px auto}
#screen.manual .mlist p{margin:0 0 5px}#screen.manual .mlist b{color:var(--amber)}
#screen.manual .mlist h3{color:var(--amber);font-size:13px;margin:12px 0 4px;letter-spacing:1px}
#screen.troph .tgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:7px;width:100%;max-width:760px}
#screen.troph .tgrid button{padding:6px 3px;font-size:10px;line-height:1.2;overflow:hidden}
#screen.troph .tgrid canvas,#screen.troph .tgrid svg,#screen.troph .tgrid img{max-width:100%}
#screen.troph .tgrid button.lock{opacity:.75}
#screen.troph .tgrid button.sel{box-shadow:inset 0 0 0 2px var(--amber)}
#screen.troph .tinfo{min-height:74px;max-width:640px;font-size:12px;line-height:1.45;margin:8px auto;text-align:left}
#screen .choices.pix{grid-template-columns:repeat(auto-fit,minmax(96px,1fr))}
#screen .choices.pix button small{font-size:10px}
#screen .choices.pix button{text-align:center;display:flex;flex-direction:column;align-items:center}
#screen .choices.pix button:disabled{opacity:.6}
#screen img.spr{image-rendering:pixelated;image-rendering:crisp-edges;margin:2px auto 6px;max-width:100%;height:auto}
#screen .row2{display:flex;gap:10px;justify-content:center}
/* centratura che non taglia il contenuto quando è più alto dello schermo (si può scorrere dall'inizio) */
#screen>:first-child{margin-top:auto}#screen>:last-child{margin-bottom:auto}
/* fine marcia: tasti sempre visibili in basso, tabella personaggi su due colonne */
#screen.endsc .row2{position:sticky;bottom:-16px;padding:8px 0 10px;background:#0e0a12;box-shadow:0 -8px 10px #0e0a12;width:100%;z-index:2;margin-bottom:-16px}
#screen.endsc .ptab{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1px 18px;font-size:12px;text-align:left;max-width:640px;margin:4px auto}
#screen.endsc .ptab div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#screen .row3{display:flex;gap:8px;width:100%;max-width:560px;margin-bottom:14px}
#screen .row3 button{flex:1;text-align:center;font-size:15px;font-weight:700;padding:12px 4px}
#screen table{font-size:12px;margin:0 auto 12px;border-collapse:collapse}
#screen td{padding:1px 8px;text-align:left}
#screen.title{background:#000;padding:0;justify-content:flex-start}
#tcv{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated;image-rendering:crisp-edges}
.ttl{position:absolute;left:50%;top:-25%;transform:translateX(-50%);margin:0;image-rendering:pixelated;image-rendering:crisp-edges;transition:top 5s steps(16,end)}
#screen.title #go{position:absolute;bottom:8%;left:50%;transform:translateX(-50%);white-space:nowrap}
#screen .pcard{display:flex;gap:22px;align-items:center;max-width:620px;margin:6px 0 14px;text-align:left}
#pspr{width:96px;height:144px;image-rendering:pixelated;image-rendering:crisp-edges;flex:none;background:#1a1620;border:2px solid #4a405a}
.pinfo .pname{font-size:20px;font-weight:800;color:var(--amber)}.pinfo .pbib{display:inline-block;background:#f0f0e8;color:#b83a2a;font-weight:800;padding:1px 8px;margin:4px 0}
.pinfo p{font-size:13px;line-height:1.5;margin:8px 0 0}
#juke{position:absolute;inset:6% 8%;background:#120e16f2;border:2px solid #4a405a;padding:8px;overflow:auto;z-index:5;text-align:left}
#juke .jh{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;font-size:12px}
#juke .jh button{padding:3px 8px;font-size:10px}
#juke .jl{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:5px}
#juke .jl button{text-align:left;padding:6px 8px;font-size:12px}
#juke .jl button small{display:block;color:var(--dim);font-size:10px}
#juke .jl button.sel{box-shadow:inset 0 0 0 2px var(--amber)}
#jukeHud{background:none;border:0;box-shadow:none;padding:0 2px;font-size:13px;display:none}
#screen.title .dbg{position:absolute;right:6px;bottom:4px;font-size:10px;color:#8a7a8a;text-align:right;display:flex;flex-direction:column;gap:3px;align-items:flex-end}
#screen select{font:inherit;background:#3a3248;color:var(--ink);border:2px solid #000;padding:2px;font-size:10px}
#screen.intro{background:#0a080c;cursor:pointer}
.crawl{position:absolute;left:50%;top:100%;width:min(640px,86%);transform:translateX(-50%);text-align:center;font-size:15px;line-height:1.75;white-space:pre-wrap;color:#e8dcc0;animation:crawl 36s linear forwards}
.crawl::first-line{color:var(--amber);font-weight:800}
@keyframes crawl{from{top:100%;transform:translate(-50%,0)}to{top:0;transform:translate(-50%,-100%)}}
#screen.intro{overflow:hidden}
.intro-tx{max-width:640px;text-align:left;font-size:14px;line-height:1.6;white-space:pre-wrap;color:#e8dcc0}
.skip{position:absolute;bottom:10px;right:14px;font-size:11px;animation:blink 1.2s steps(2) infinite}
.copy{position:absolute;z-index:5;text-shadow:0 0 3px #000,0 0 3px #000;bottom:calc(8px + env(safe-area-inset-bottom));left:calc(16px + env(safe-area-inset-left));font-size:11px;color:#b8a890;opacity:.95;letter-spacing:.5px}
@keyframes blink{50%{opacity:.2}}
.mapwrap{display:flex;gap:18px;align-items:center;justify-content:center;width:100%;height:100%}
#mcv{height:min(86%,520px);max-width:58%;aspect-ratio:160/135;image-rendering:pixelated;border:3px solid #000;background:#1a2a3a}
.minfo{text-align:left;max-width:340px}
.minfo .yr{font-size:44px;font-weight:900;color:var(--amber);letter-spacing:3px;line-height:1}
.minfo .rt{font-weight:700;color:var(--ink)}
#rot{position:absolute;inset:0;z-index:20;background:#0a080c;display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;gap:14px}
#rot.on{display:flex}
#app.turn{position:fixed;left:0;top:0;width:100vh;height:100vw;transform-origin:0 0;transform:translateX(100vw) rotate(90deg);padding:0}
.fsb{background:none;border:0;box-shadow:none;padding:0 2px;font-size:13px}
#toast{position:absolute;left:50%;bottom:36%;transform:translateX(-50%);background:#2e2738;border:2px solid #000;padding:8px 12px;font-size:12px;z-index:40;max-width:80%;text-align:center;display:none}
@media (max-height:340px){#hud{font-size:10px}#bottom{min-height:80px}.pad svg{width:22px;height:22px}#inv button{padding:3px 2px;font-size:10px}}
#rot .ph{font-size:46px;animation:rot 2s ease-in-out infinite}
@keyframes rot{0%,30%{transform:rotate(0)}60%,100%{transform:rotate(-90deg)}}
@media (orientation:portrait){.mapwrap{flex-direction:column}#mcv{height:auto;width:90%;max-width:90%}}
.hide{display:none!important}
</style>
</head>
<body>
<div id="app"><div id="blackout"></div>
  <div id="stage">
    <canvas id="scene"></canvas><canvas id="fx"></canvas><div id="vig"></div><div id="chatb"></div><div id="chatd">Sto morendo...</div><canvas id="cdn" class="ttl"></canvas>
    <div id="hud">
      <div class="row"><b id="bib">N.47</b><span class="lbl" id="yr">1980</span><span><span class="lbl">IN GARA</span> <b id="alive">50</b></span><div id="warns"><i></i><i></i><i></i></div><button id="jukeHud">🎵</button><button id="mute">🔊</button><button class="fsb" id="fsHud" title="schermo intero">⛶</button></div>
      <div class="bars">
        <span class="lbl">STAMINA</span><div class="bar"><div class="fill" id="bST"></div><div class="cap" id="bCAP"></div></div>
        <span class="lbl">ACQUA</span><div class="bar"><div class="fill" id="bHY"></div></div>
        <span class="lbl">VESCICA</span><div class="bar"><div class="fill" id="bBL"></div></div>

    <div id="box" class="box hide"></div>

  <div id="bottom">
    <div class="pad next" id="padL"><svg viewBox="0 0 10 10" shape-rendering="crispEdges"><path fill="currentColor" d="M3 1h3v1h1v4h-1v2h-1v1h-2v-1h-1v-3h1z"/></svg>SINISTRO</div>
    <div id="center">
      <div id="log"></div>
      <div id="inv">
        <button id="iDrink">💧 BEVI</button>
        <button id="iBisc">🍪 BISCOTTI <span id="nBisc">2</span></button>
        <button id="iPan">🥪 PANINI <span id="nPan">3</span></button>
        <button id="iHam">🥩 HAMBURGER</button>

        <button id="iPee">🚽 LIBERATI</button>
      </div>
    </div>
    <div class="pad" id="padR"><svg viewBox="0 0 10 10" shape-rendering="crispEdges"><path fill="currentColor" d="M4 1h3v4h1v3h-1v1h-2v-1h-1v-2h-1v-4h1z"/></svg>DESTRO</div>

  <div id="screen"></div>

</div>
<script>
(()=>{
'use strict';
const H=128,LIMIT=5.5,SR=LIMIT/6.4,K=4.6*SR,TOTAL=46,QPER=10,SPR=2; // SR: rapporto col vecchio limite (6,4 km/h) per ricalibrare passo e fatica
let W=320,PX=96;
const $=id=>document.getElementById(id);
const cv=$('scene');let cx=cv.getContext('2d');let OFF=null,OCX=null;
const rand=(a,b)=>a+Math.random()*(b-a), clamp=(v,a,b)=>Math.max(a,Math.min(b,v)), pick=a=>a[Math.floor(Math.random()*a.length)];
const fmt=(n,d=1)=>n.toFixed(d).replace('.',',');
let DEBUG=false,DEBUG_YEAR=null,DEBUG_RUN0=0,DEBUG_ID=''; /* [DEV] DEBUG_ID: ''=casuale, 'none','black','gay','both' */
const MEM={};const store={get(k,d){if(k in MEM)return MEM[k];try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v);}catch(e){return d;}},set(k,v){MEM[k]=v;try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}};
function fit(){const r={width:cv.clientWidth,height:cv.clientHeight};if(r.width<10||r.height<10)return;const w=clamp(Math.round(H*r.width/r.height),110,560);if(cv.width!==w||cv.height!==H){cv.width=w;cv.height=H;}W=w;PX=Math.round(W*.3);cx.imageSmoothingEnabled=false;}
const offMin=()=>-(PX-40)/SPR, offMax=()=>(W-PX-10)/SPR;

/* ================= EPOCHE (ogni 5 gare = 5 anni) ================= */
const ERAS=[
 {from:1980,name:'Anni \'80 · I',shirts:['#e84a7a','#3ac8c8','#f0c838','#8a5ad8','#e86a2a','#4ab84a','#e8e8e8'],pants:'#2a3a6a',band:true,veh:'apc',vc:'#4a5a34',helm:'#2e3a24',poster:['#b83a2a','#e8d8a0'],
  r:{label:'un pezzo disco',bpm:120,wave:'square',bass:'square',root:220,scale:[0,2,4,7,9],prog:[0,5,-3,-5],pat:[4,null,3,4,null,2,null,3,4,null,5,4,3,null,2,null],drums:'four',bm:'oct'},
  m:{bpm:62,wave:'square',bass:'triangle',root:196,scale:[0,2,3,5,7,8,10],prog:[0,-4,-7,-5],pat:[4,null,null,null,3,null,null,null,2,null,null,1,0,null,null,null],dirge:true}},

const TR='fnsc';
function makeProfile(ans){
  const tr={f:50,n:50,s:50,c:50};
  /* ogni risposta dà sempre un PRO su un tratto e un CONTRO su un altro tratto */
  const other=(k,qi,sh)=>{const o=[...TR].filter(x=>x!==k);return o[(qi*7+sh)%3];};
  ans.forEach(([qi,a])=>{const[,k,sg]=QUIZ[qi];let pro,con,pv,cv;
    /* la risposta "sana" (VERO sulle affermazioni positive, FALSO su quelle negative) dà il pregio più grande */
    if(a===0){pv=sg>0?7:4;cv=4;if(sg>0){pro=k;con=other(k,qi,1);}else{con=k;pro=other(k,qi,1);}}
    else if(a===1){pv=sg<0?7:4;cv=4;if(sg>0){con=k;pro=other(k,qi,2);}else{pro=k;con=other(k,qi,2);}}
    else{pv=3;cv=3;con='n';pro=k!=='n'?k:other('n',qi,0);}
    tr[pro]+=pv;tr[con]-=cv;});
  for(const k in tr)tr[k]=clamp(tr[k],10,90);
  return tr;
}

let AC=null,NOISE=null,MUTE=store.get('up_mute',false);
function initAudio(){try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();const p=AC.resume&&AC.resume();if(p&&p.catch)p.catch(()=>{});
  if(!NOISE){NOISE=AC.createBuffer(1,AC.sampleRate*.6,AC.sampleRate);const d=NOISE.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/d.length,3);}
  startMusic();}catch(e){AC=null;}}
function tone(f,d,type='square',v=.05,f2,delay=0,abs){if(!AC||MUTE)return;try{const t0=abs!=null?abs:AC.currentTime+delay,o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.setValueAtTime(f,t0);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t0+d);g.gain.setValueAtTime(v,t0);g.gain.exponentialRampToValueAtTime(.0001,t0+d);o.connect(g);g.connect(AC.destination);o.start(t0);o.stop(t0+d+.02);}catch(e){}}
function noise(v=.4,d=.4,abs,freq=1800){if(!AC||!NOISE||MUTE)return;try{const s=AC.createBufferSource(),g=AC.createGain(),f=AC.createBiquadFilter();f.type='lowpass';f.frequency.value=freq;s.buffer=NOISE;g.gain.value=v;s.connect(f);f.connect(g);g.connect(AC.destination);const t=abs!=null?abs:AC.currentTime;s.start(t);s.stop(t+d);}catch(e){}}

let _TR=null;const TRACKS=()=>_TR||(_TR=[{n:'Marcia militare (titolo e menu)',m:MARCH}].concat(ERAS.flatMap(e=>[{n:e.from+' · sottofondo ('+e.name+')',m:e.m},...(e.r?[{n:e.from+' · radio: '+e.r.label,m:e.r},{n:e.from+' · radio guasta a metà',m:{...e.r,dist:.5}},{n:e.from+' · radio guasta (finale)',m:{...e.r,dist:1}}]:[])])));
function radioDist(m){if(m&&m.dist!=null)return m.dist;if(!S||!S.radio||!ERA.r||m!==ERA.r||(S.mode!=='play'&&S.mode!=='dying'))return 0;return clamp((progress()-.15)/.85,0,1);}
function startMusic(){if(!AC||MUS.timer)return;MUS.next=AC.currentTime+.1;MUS.timer=setInterval(()=>{try{if(!AC)return;const menu=MENU_MUSIC&&(!S||(S.mode!=='play'&&S.mode!=='dying'));const m=JUKE||(menu?MARCH:(S&&S.radio&&ERA.r)?ERA.r:ERA.m),spb=60/m.bpm/4*(1+.55*radioDist(m));
  if(MUS.next<AC.currentTime)MUS.next=AC.currentTime+.05;
  let guard=0;while(MUS.next<AC.currentTime+.25&&guard++<16){playStep(MUS.step,MUS.next,m,spb);MUS.next+=spb;MUS.step++;}}catch(e){}},60);}
function playStep(i,t,m,spb){
  if(MUTE||(!JUKE&&m!==MARCH&&(!S||S.mode!=='play')))return;
  /* radio che si guasta: più la marcia è disperata (filtro grigio), più la musica si stona, rallenta, scende e diventa inquietante */
  const D=radioDist(m);
  const tn=(f,d,w,v,f2,dl,tt)=>{if(D>0){if(Math.random()<D*.35)return;const det=Math.pow(2,(Math.random()-.5)*D*1.4/12);f*=det;d*=1+D*.8;if(D>.55)w='sawtooth';v*=1-D*.25;if(D>.25&&!f2)f2=f*(1-D*.14);}tone(f,d,w,v,f2,dl,tt);};
  const nz=(v,d,tt,fr)=>{if(D>0){if(Math.random()<D*.3)return;fr=(fr||1800)*(1-D*.75);d*=1+D;}noise(v,d,tt,fr);};
  const bar=Math.floor(i/16)%4,s=i%16,root=m.root*Math.pow(2,(m.prog[bar]-D*5)/12);
  if(D>.45&&s===0){tone(root/4*1.414,spb*16*(1+D),'sawtooth',.025*D,root/4*1.33,0,t);tone(root*2.12,spb*12,'sine',.012*D,root*1.9,0,t+spb*4);}
  if(D>.7&&s===8&&Math.random()<.5)noise(.12*D,1.2,t,400);
  if(m.drums){const kick=()=>tn(80,.1,'sine',.12,40,0,t),hat=v=>nz(v,.04,t,7000),snare=(v,d)=>nz(v,d,t,2800),B=(f,d)=>tn(f,d,m.bass,.045,null,0,t);
    if(m.drums==='four'){if(s%4===0)kick();if(s%4===2)hat(.06);if(s%8===4)snare(.1,.08);}
    else if(m.drums==='gated'){if(s===0||s===10)kick();if(s%8===4)snare(.2,.22);if(s%2===0)hat(.03);}
    else if(m.drums==='back'){if(s===0||s===6||s===8)kick();if(s%8===4)snare(.12,.1);if(s%2===0)hat(.035);}
    else if(m.drums==='march'){const bar=Math.floor(i/16)%4,acc=[0,3,6,8,10],roll=(bar%2===1&&s>=8)||(bar===3&&s>=4);if(s===0)tn(60,.18,'sine',.09,40,0,t);if(roll){nz(.07+.05*(s/16),.05,t,3000);nz(.05,.04,t+spb/2,3000);}else if(acc.includes(s))nz(s===0||s===8?.18:.11,.08,t,2800);else if(s%2===1)nz(.025,.03,t,3600);}
    else if(m.drums==='half'){if(s===0||s===3)kick();if(s===8)snare(.18,.18);hat(s%2?.02:.04);}
    if(m.bm==='oct'){if(s%2===0)B(root/(s%4===0?4:2),spb*1.6);}
    else if(m.bm==='eighth'){if(s%2===0)B(root/4,spb*1.5);}
    else if(m.bm==='off'){if(s%4===2)B(root/2,spb*1.8);}
    else if(m.bm==='pump'){if(s%4!==0)B(root/4,spb*.8);}
    else if(m.bm==='root'){if(s%8===0)B(root/4,spb*6);}
    else if(m.bm==='oompah'){if(s%4===0)B(s%8===0?root/2:root/2*1.5,spb*1.8);}
    else if(m.bm==='long'){if(s%8===0)tn(root/4,spb*7,m.bass,.05,root/3,0,t);}}
  else if(m.dirge){if(s%8===0)tn(root/2,spb*7,m.bass,.045,null,0,t);if(s===0||s===8)tn(55,.35,'sine',.09,40,0,t);}
  else if(s%4===0)tn(root/2,spb*3,m.bass,.05,null,0,t);
  const p=m.pat[s];if(p!=null){const oct=Math.floor(p/m.scale.length);tn(root*Math.pow(2,(m.scale[p%m.scale.length]+12*oct)/12),m.dirge?spb*3.5:spb*.9,m.wave,m.dirge?.014:.018,null,0,t);}
  if(m.drum&&!m.drums){if(s%8===4)nz(.08,.06,t,4000);if(s%8===0)tn(70,.08,'sine',.08,40,0,t);}
}

function startQTE(type,who){
  /* 1 volta su 4 un amico ti aiuta da solo (e l'amicizia cresce) */
  if(HELP[type]){const br=friends().filter(n=>n.rel>=80),fr=br.length?br:(type==='rialzati'?[]:friends());if(fr.length&&Math.random()<(br.length?.5:.25)){const f=pick(fr);S.qte={type,who,t:0,n:0};if(f.rel>=80)f.savedMe=true;log(HELP[type].replace('{n}',f.name),'var(--green)');endQTE(true);relUp(f,6);return;}}
  const q={type,t:0,who,n:0};
  Object.assign(q,{
   crampo:{dur:3.6,need:8,title:'CRAMPO!',sub:'Massaggia il polpaccio camminando',btn:'MASSAGGIA'},
   caduta:{dur:1.6,title:'INCIAMPI!',sub:'Ritrova l\'equilibrio quando il segno è nel verde',btn:'EQUILIBRIO',timing:true},
   anguria:{dur:2,need:7,title:'ANGURIA!',sub:'Allunga la mano prima che arrivino i soldati!',btn:'AFFERRA'},
   acqua:{dur:1.8,title:'ACQUA DALLA FOLLA!',sub:'Un vecchio tende una bottiglia oltre il filo spinato',btn:'AFFERRA'},
   spinta:{dur:2.2,need:5,title:(who||'').toUpperCase()+' TI SPINGE!',sub:'Resta in piedi',btn:'RESISTI'},
   isteria:{dur:4,need:7,title:'PANICO',sub:'Il cuore impazzisce. Respira.',btn:'RESPIRA'},
   blocco:{dur:4,need:10,title:'LE GAMBE NON SI MUOVONO',sub:'Tutti partono. Tu no. Sbloccati!',btn:'MUOVITI'},
   sgambetto:{dur:1.6,title:(who||'').toUpperCase()+' TI FA LO SGAMBETTO!',sub:'Salta quando il segno è nel verde',btn:'SALTA',timing:true},
   rialzati:{dur:3,need:Math.min(35,20+5*((S&&S.collapses||1)-1)),title:'RIALZATI!',sub:(S&&S.collapsed==='mh'?'La mente cede.':'Il corpo cede.')+' Tocca i tasti dei piedi più veloce che puoi!',btn:'',padsOnly:1},
   salva:{dur:3.2,need:9,title:'SORREGGI '+(who||'').toUpperCase()+'!',sub:'Tienilo in piedi senza rallentare',btn:'SORREGGI'},
  }[type]);
  if(q.timing){q.z0=rand(.45,.65);q.z1=q.z0+.17;}
  S.qte=q;
  showBox('box qte',`<div class="big">${q.title}</div><div class="tx">${q.sub}</div>${q.timing?`<div class="track"><div class="zone" style="left:${q.z0*100}%;width:${(q.z1-q.z0)*100}%"></div><div class="mk" id="mk"></div></div>`:''}${q.need?`<div class="tx" id="qn">0 / ${q.need}</div>`:''}${q.padsOnly?'':`<button class="main" id="qb">${q.btn}</button>`}<div class="tm" style="width:80%"><b id="qt"></b></div>`);
  if($('qb'))$('qb').addEventListener('pointerdown',e=>{e.preventDefault();qteHit();});
  sfx.tick();buzz(40);
}
function qteHit(){const q=S.qte;if(!q)return;
  if(q.need){q.n++;sfx.tick();const el=$('qn');if(el)el.textContent=q.n+' / '+q.need;if(q.n>=q.need)endQTE(true);}
  else if(q.timing){const p=q.t/q.dur;endQTE(p>=q.z0&&p<=q.z1);}else endQTE(true);}
const friends=()=>S.alone?[]:S.npcs.filter(n=>n!==S.dyingNpc&&n.named&&n.alive&&!n.leaving&&n.rel>=40);
function endQTE(ok){
  const q=S.qte;S.qte=null;hideBox();const G='var(--green)',Rd='var(--red)';
  if(q.type==='rialzati'){
    if(ok){sfx.good();const k=S.collapsed;S.collapsed=false;if(k==='mh')S.mh=Math.max(S.mh,30);else S.ph=Math.max(S.ph,30);S.st=Math.max(S.st,30);S.mh=Math.max(S.mh,5);S.ph=Math.max(S.ph,5);S.underT=0;
      log(k==='mh'?'Ti rialzi tremando. Il respiro torna, a fatica.':'Ti rialzi barcollando. Le gambe reggono, per ora.','var(--green)');}
    else{sfx.bad();log('Non riesci ad alzarti.','var(--red)');S.rT=0;}
    return;}
  if(q.type==='anguria'){const k=S.kiosk;if(k){k.st='raid';k.raidT=S.t;}
    if(ok){sfx.good();S.ph=Math.min(100,S.ph+18);S.mh=Math.min(100,S.mh+15);S.melonT=S.t+90;log('Strappi una fetta di anguria. Il succo ti cola sul mento: niente è mai stato così buono.',G);}
    else{sfx.bad();log('La mano si chiude sul vuoto.','var(--dim)');}
    setTimeout(()=>{if(S&&S.mode==='play')log('I soldati rovesciano il banco e trascinano via l\'omino coi baffi. Le angurie spariscono nel camion.','var(--red)');},1500);return;}
  if(q.type==='salva'){const n=S.saving;if(!n)return;
    if(ok){sfx.good();log('Lo tieni su. Un passo, poi un altro.',G);}else{sfx.bad();buzz(120);n.saveFail=true;log('Rallenti per reggerlo.',Rd);addWarn('hai rallentato per sorreggere un amico');}
    n.saveLeft--;
    if(n.saveLeft>0&&S.mode==='play')setTimeout(()=>{if(S&&S.mode==='play'&&!S.qte&&n.alive)startQTE('salva',n.name);else finishSave(n);},1200);else finishSave(n);
    return;}
  if(ok){sfx.good();({acqua:()=>{S.hy=Math.min(100,S.hy+20);S.bl+=8;log('Bevi avidamente.',G);},crampo:()=>log('Il crampo si scioglie.',G),caduta:()=>log('Barcolli ma resti in piedi.',G),
      spinta:()=>log('Resti in piedi. '+q.who+' sbuffa.',G),sgambetto:()=>log('Lo scavalchi. '+q.who+' impreca.',G),isteria:()=>{S.mh+=4;log('Il respiro torna regolare.',G);},blocco:()=>log('Le gambe ripartono.',G)})[q.type]();return;}
  sfx.bad();buzz(120);
  if(q.type==='acqua'){log('La bottiglia cade nella polvere.','var(--dim)');return;}
  if(q.type==='blocco'){log('Sei rimasto fermo troppo a lungo.',Rd);addWarn('sei rimasto bloccato, fermo in mezzo alla strada');return;}
  const fr=friends();
  if(fr.length&&Math.random()<.5){log(pick(fr).name+' ti sorregge per un braccio.',G);S.speed-=.8;S.st-=5;return;}
  if(q.type==='crampo'){S.st-=18;S.ph-=4;S.speed-=2*SR;log('Il crampo ti morde la gamba.',Rd);}
  if(q.type==='caduta'){S.ph-=10;S.speed-=3*SR;S.steps=[];if(Math.random()<.3){S.injury=true;log('Cadi sull\'asfalto. Il ginocchio sanguina.',Rd);}else log('Cadi e ti rialzi di scatto.',Rd);}
  if(q.type==='spinta'){S.st-=10;S.speed-=3*SR;S.steps=[];log('Barcolli. '+q.who+' ride.',Rd);}
  if(q.type==='sgambetto'){S.ph-=8;S.st-=10;S.speed-=3.5*SR;S.steps=[];log('Cadi lungo disteso. '+q.who+' ride.',Rd);}
  if(q.type==='isteria'){S.mh-=10;S.speed-=2.5*SR;S.steps=[];log('Urli qualcosa che non ricorderai. I soldati ti guardano.',Rd);}
  S.st=Math.max(0,S.st);S.speed=Math.max(0,S.speed);
}
/* un amico fraterno sta per cedere: puoi provare a salvarlo */
function askSave(n){n.saveAsked=true;n.savePending=true;n.saveAskT=S.t;
  choice(n.name.toUpperCase()+' STA CEDENDO',n.name+' barcolla, gli occhi rovesciati. Se lo lasci, i soldati lo finiranno.',[
    {l:'Lo sorreggi',f:()=>{n.savePending=false;S.saving=n;n.saveLeft=Math.random()<.5?1:2;n.saveFail=false;startQTE('salva',n.name);}},
    {l:'Lo lasci andare',f:()=>{n.savePending=false;n.leaving=1;S.mh-=12;log('Lasci la sua mano. Non ti volti.','var(--red)');if(n.savedMe)betray(n);}}],8,1);}
function finishSave(n){S.saving=null;if(!n.alive||n.leaving)return;
  if(n.saveFail){n.leaving=1;S.mh-=10;log(n.name+' ti scivola via dalle braccia.','var(--red)');}
  else{n.elimAt=S.t+rand(150,300);n.warns=0;n.w3=0;n.tempW=0;S.mh=Math.min(100,S.mh+10);relUp(n,10);log(n.name+' riprende fiato: «Ti devo la vita.»','var(--green)');}}
function choice(title,text,opts,dur,def){
  S.dlg={choice:true,t:0,dur,def,opts};
  showBox('box',`<div class="nm" style="color:var(--amber);flex:none">${title}</div><div class="tx">${text}</div><div class="tm"><b id="dt"></b></div><div class="opts">${opts.map((o,i)=>`<button data-i="${i}">${o.l}</button>`).join('')}</div>`);
  box.querySelectorAll('.opts button').forEach(b=>b.addEventListener('pointerdown',e=>{e.preventDefault();const g=S.dlg;S.dlg=null;hideBox();S.dlgFree=S.t+3.5;g.opts[+b.dataset.i].f();}));
  sfx.tick();
}
/* un personaggio vicino ti chiede uno dei tuoi consumabili */
const ASKS={tub:['un tubetto','Ho il cinturone vuoto. Mi daresti un tubetto? Uno solo.'],bisc:['un biscotto','Quei biscotti... li ha fatti tua madre? Me ne dai uno?'],pan:['un panino','Ho visto i panini. Ti prego, uno. Ti ripago al traguardo.'],bar:['la barretta','Quella barretta... io non mangio da ore. Me la dai?'],cig:['una sigaretta','Hai una sigaretta? Mi tremano le mani.']};
function askItem(){
  if(S.alone)return false;
  const have=Object.keys(ASKS).filter(k=>(S[k]||0)>0);if(!have.length)return 'none';
  const c=S.npcs.filter(n=>n!==S.dyingNpc&&n.named&&n.alive&&!n.leaving&&isNear(n));if(!c.length)return false;
  const n=pick(c),k=pick(have),[what,line]=ASKS[k];
  choice(n.name.toUpperCase()+' TI CHIEDE '+what.toUpperCase(),'«'+line+'»',[
    {l:'Glielo dai',f:()=>{if((S[k]||0)<=0)return;S[k]--;relUp(n,12);S.mh=Math.min(100,S.mh+4);n.elimAt+=rand(15,35);log(n.name+': «Grazie. Non lo dimenticherò.»','var(--green)');}},
    {l:'Non glielo dai',f:()=>{if(n.rel>=80){S.mh=Math.max(0,S.mh-8);log(n.name+' abbassa gli occhi e non dice niente. Ti senti un verme.','var(--red)');}else if(n.rel>=40){relUp(n,-15);log(n.name+': «Bell\'amico che sei.»','var(--red)');}else{relUp(n,-4);log(n.name+' alza le spalle e si allontana.','var(--dim)');}}}],8,1);
  return true;
}
function startDialog(){
  if(progress()>.75){const c=S.npcs.filter(n=>n!==S.dyingNpc&&n.named&&n.alive&&!n.leaving&&n!==S.lastTalk);if(!c.length)return;const near=c.filter(isNear);const npc=near.length?pick(near):pick(c);if(!nearOr(npc))return false;openDlg(npc,freshPick(LATE),'mad');return true;}
  const extra=n=>n.stage>=DLG[n.id].length&&n.stage<DLG[n.id].length+5&&Math.abs(n.rel)>=40&&Math.abs(n.rel)<80;
  const cands=S.npcs.filter(n=>n!==S.dyingNpc&&n.named&&n.alive&&!n.leaving&&(n.stage<DLG[n.id].length||extra(n)||arcReady(n))&&n!==S.lastTalk);if(!cands.length)return;
  const near=cands.filter(isNear),app=cands.find(n=>n.appT>S.t);const npc=near.length?pick(near):(app||pick(cands));if(!nearOr(npc))return false;
  if(arcReady(npc)&&(Math.random()<.65||!(npc.stage<DLG[npc.id].length||extra(npc)))){const a=npc.arc||0;npc.arc=a+1;S.lastTalk=npc;openDlg(npc,DEEP[`arc_${npc.id}${a}_x1`],'deep');return true;}
  const d=npc.stage<DLG[npc.id].length?DLG[npc.id][npc.stage]:pick(npc.rel>0?BOND:FEUD);
  openDlg(npc,d,'base');
}
function deepTalk(){
  if(S.alone)return false;
  const br=S.npcs.filter(n=>n!==S.dyingNpc&&n.named&&n.alive&&!n.leaving&&n.rel>=80);if(!br.length)return false;
  let left=DEEP_START.filter(k=>!S.deepUsed.includes(k));if(!left.length){S.deepUsed=[];left=DEEP_START.slice();}
  const n=br.find(isNear);if(!n){nearOr(pick(br));return false;}
  const pr=progress(),r=Math.random();let k;
  if(pr>.6&&r<.5)k=freshPick(BRO_SICK);else if(r<.55)k=freshPick(BRO_CHAT);else{k=pick(left);S.deepUsed.push(k);}
  openDlg(n,DEEP[k],'deep');return true;
}
function loveQ(){const c=S.npcs.filter(n=>n!==S.dyingNpc&&n.named&&n.alive&&!n.leaving);if(!c.length)return false;const n=c.find(isNear);if(!n){nearOr(pick(c));return false;}openDlg(n,LOVEQ,'loveq');return true;}
function bigotTalk(){
  const bg=S.npcs.filter(n=>n!==S.dyingNpc&&n.bigot&&n.alive&&!n.leaving);if(!bg.length)return false;
  const pool=[...(S.black?SLUR.black:[]),...(S.outed?SLUR.gay:[])];if(!pool.length)return false;
  const b=pick(bg),t=pick(pool);
  if(!isNear(b)){S.mh=Math.max(0,S.mh-3);sfx.bad();shout(b,t.replace(/<[^>]+>/g,''));return true;}
  S.mh=Math.max(0,S.mh-6);sfx.bad();
  openDlg(b,{t,o:slurOpts()},'bigot');return true;
}
/* verso il finale (restano 5 o meno) 1 volta su 3 anche le tue risposte diventano malate: ne resta sempre una sana */
/* [frase, MH, stamina]: quasi tutte costano mente, ma alcune danno stamina e qualcuna, per assurdo, anche mente */
const SICK_ANS=[["«Ah ah. Sì. Sì. Ah ah ah.»",3,0],["«Ti sento dentro la testa, sai?»",-4,0],["«Contami i denti. Mi sembra che ne manchi uno.»",-4,0],["«Shh. La strada ci ascolta.»",-3,6],["«Io sono già morto ieri, non preoccuparti.»",-5,10],["«Mangerei l'asfalto. È caldo, sembra pane.»",-3,8],["«Il blindato mi ha chiamato per nome. Con la voce di mia madre.»",-6,0],["«Ripeti. Ripeti. Ripeti quello che hai detto.»",-4,0],["Ridi, e non riesci a smettere.",5,-3],["Ti metti a piangere senza motivo.",4,0],["«Chi sei tu? Ci conosciamo?»",-4,0],["«Lo sapevo. Lo sapevo da sempre.»",-2,6],["Canticchi una ninna nanna a voce altissima.",3,4],["«Le mie scarpe sono piene di sangue. Che bello, sono calde.»",-4,12],["«Dio guida il cingolato. L'ho visto.»",-6,0],["«Non parlare. Ti sentono i morti.»",-4,0],["Annusi l'aria come un cane.",-2,8],["«Se mi tocchi, mi sciolgo.»",-4,0],["«Ho contato le stelle. Sono quarantanove.»",-3,0],["«Le mie gambe sono di un altro. Gliele devo restituire.»",-4,14]];
function sickify(d){
  const alive=S.npcs.filter(n=>n.alive&&!n.leaving).length+1;if(alive>5||Math.random()>=1/3||d.o.length<2)return d;
  const sc=o=>o.m!=null?o.m*2+(o.r||0)*.1:(o.r||0);let best=0;d.o.forEach((o,i)=>{if(sc(o)>sc(d.o[best]))best=i;});
  return {...d,o:d.o.map((o,i)=>{if(i===best)return o;const a=freshPick(SICK_ANS);return {...o,l:a[0],sick:1,sm:a[1],ss:a[2]};})};
}
function openDlg(npc,d,kind){
  const fill=x=>x.replace(/\{ME\}/g,npc.name).replace(/\{CITY\}/g,npc.from||'casa');
  d={...d,t:fill(d.t),o:d.o.filter(o=>!o.g||S.gay).map(o=>({...o,l:fill(o.l)}))};
  if(kind!=='bigot'&&kind!=='loveq')d=sickify(d);
  S.dlg={npc,d,t:0,dur:kind==='deep'?16:12,kind};S.lastTalk=npc;
  showBox('box',`<div class="hd"><canvas width="16" height="16" id="face"></canvas><div><div class="nm">${npc.named?npc.name+' <span class="rl">N.'+npc.bibN+'</span>':npc.name} <span class="rl">· ${npc.from||'?'}${npc.state?' ('+npc.state+')':''}</span></div><div class="rl" style="color:${relColor(npc.rel)}">${relLabel(npc.rel)}</div></div></div><div class="tx">“${d.t.replace('{N}',S.bib)}”</div><div class="tm"><b id="dt"></b></div><div class="opts">${d.o.map((o,i)=>`<button data-i="${i}">${o.l}</button>`).join('')}</div>`);
  drawFace($('face').getContext('2d'),npc);
  box.querySelectorAll('.opts button').forEach(b=>b.addEventListener('pointerdown',e=>{e.preventDefault();answer(+b.dataset.i);}));
  sfx.tick();
}
function answer(i){
  const g=S.dlg;if(!g)return;S.dlg=null;hideBox();S.dlgFree=S.t+3.5;const npc=g.npc;
  if(i>=0&&g.d.o[i]&&g.d.o[i].sick){const o=g.d.o[i];S.mh=clamp(S.mh+o.sm,0,100);if(o.ss)S.st=clamp(S.st+o.ss,0,S.maxSt);const good=o.sm>0||o.ss>0;setTimeout(()=>{if(S&&S.mode==='play')log((o.sm>0?pick(['“Strano. Mi sento meglio.”','“Che risata. Mi gira la testa, ma va bene.”','“Era assurdo. Eppure mi ha fatto bene.”']):o.ss>0?pick(['“Una forza strana nelle gambe. Non so da dove arriva.”','“La follia scalda. Le gambe vanno da sole.”']):pick(['“Perché l\'ho detto?”','“Quella non era la mia voce.”','“Sto perdendo la testa.”','“Chi ha parlato? Io?”']))+(o.ss?` (stamina ${o.ss>0?'+':''}${o.ss})`:''),good?'var(--amber)':'var(--red)','th');},900);}
  if(g.kind==='bigot'){const o=i<0?g.d.o.find(x=>x.def):g.d.o[i];npc.rel=clamp((npc.rel||0)+o.r,-100,100);S.mh=clamp(S.mh+o.m,0,100);if(o.s)S.st=clamp(S.st+o.s,0,S.maxSt);
    log(o.f,o.m>0?'var(--green)':o.m>=-1?'var(--dim)':'var(--red)');
    const fr=friends();if(fr.length&&Math.random()<.65){const f=pick(fr);setTimeout(()=>{if(!S||S.mode!=='play')return;S.mh=Math.min(100,S.mh+8);f.rel=Math.min(100,f.rel+4);log(f.name+' si mette in mezzo: '+pick(DEFEND),'var(--green)');sfx.good();},1800);}
    return;}
  if(i>=0&&g.d.o[i].out&&!S.outed){S.outed=true;setTimeout(()=>{if(S&&S.mode==='play')log('Qualcuno ha sentito. La voce corre lungo la fila.','var(--dim)');},2500);}
  if(g.kind==='mad'){if(i<0){S.mh=Math.max(0,S.mh-2);log('Lo lasci parlare da solo. Continua lo stesso.','var(--dim)');return;}const o=g.d.o[i];relUp(npc,o.r);S.mh=clamp(S.mh+o.m,0,100);
    log(o.m>0?npc.name+' sbatte le palpebre, come se si svegliasse.':o.m<-4?'Per un attimo ci credi anche tu.':npc.name+' sorride a qualcuno che non c\'è.',o.m>0?'var(--green)':o.m<-4?'var(--red)':'var(--dim)');return;}
  if(g.kind==='loveq'){if(i<0){log(npc.name+' alza le spalle.','var(--dim)');return;}const o=g.d.o[i];npc.rel=clamp(npc.rel+o.r,-100,100);S.mh=clamp(S.mh+o.m,0,100);
    if(o.out){const ok=npc.rel>=0&&Math.random()<.75;npc.rel=clamp(npc.rel+(ok?8:-18),-100,100);log(npc.name+(ok?' sorride: «Allora spero che ti aspetti.»':' fa una smorfia e si allontana.'),ok?'var(--green)':'var(--red)');}
    else log(npc.name+(o.r<0?' alza le mani: «Scusa.»':' annuisce.'),'var(--dim)');return;}
  if(g.kind==='deep'){if(i<0){log(npc.name+' resta in silenzio accanto a te.','var(--dim)');return;}
    const o=g.d.o[i];npc.rel=clamp(npc.rel+o.r,-100,100);S.mh=clamp(S.mh+o.m,0,100);
    if(o.n)setTimeout(()=>{if(S&&S.mode==='play'&&!S.dlg&&!S.qte&&npc.alive&&!npc.leaving)openDlg(npc,DEEP[o.n],'deep');},1800);
    else log(npc.name+' ti stringe la spalla, senza dire niente.','var(--green)');
    return;}
  npc.stage++;
  if(i<0){npc.rel-=5;log('Ignori '+npc.name+'. Si allontana in silenzio.','var(--dim)');return;}
  const o=g.d.o[i],before=relLabel(npc.rel);npc.rel=clamp(npc.rel+o.r,-100,100);
  if(o.s)S.st=clamp(S.st+o.s,0,S.maxSt);if(o.r>0)S.mh=Math.min(100,S.mh+o.r/4);
  log(npc.name+(o.r>5?' sorride.':o.r<0?' ti guarda storto.':' annuisce.')+(o.s?` (stamina ${o.s>0?'+':''}${o.s})`:''),o.r>0?'var(--green)':o.r<0?'var(--red)':'var(--dim)');
  const after=relLabel(npc.rel);
  if(after!==before&&(after==='Amico'||after==='Rivale'))log(npc.name+(after==='Amico'?' ora è tuo amico.':' ora è tuo rivale.'),after==='Amico'?'var(--green)':'var(--red)');
  if(after!==before&&after==='Fraterno'){S.bro=true;npc.buddy=pick([-5,-4,4,5]);npc.lane=pick([2,3]);log(npc.name+' ora è come un fratello per te.','var(--green)');}
  if(after!==before&&after==='Odio mortale'){S.hate=true;log(npc.name+' ti odia a morte.','var(--red)');}
}
const isHeat=()=>{const h=hourNow()%24,w=S.wx.heat;return !!w&&h>=w[0]&&h<w[1];};
function randomEvent(){
  const heat=isHeat(),wx=S.wx;
  const ev=[['crampo',2+(S.hy<40?3:0)],['caduta',2+(S.st<30?2:0)],['sasso',1.6],['salita',1.1*wx.hill*(S.zplan&&S.zplan[S.zi].z==='montagna'?2.2:1)],['pioggia',.9*wx.rain],['isteria',S.mh<35?3.5:0]];
  let r=Math.random()*ev.reduce((a,e)=>a+e[1],0),ch='crampo';for(const e of ev){r-=e[1];if(r<=0){ch=e[0];break;}}
  if(ch==='sasso'){if((S.sassi||0)>=2)ch='crampo';else S.sassi=(S.sassi||0)+1;}
  if(ch==='salita'){S.hillLen=Math.random()<.5?rand(12,18):rand(28,42);S.hill=S.hillLen;log(S.hillLen>25?'Inizia una lunga salita.':'Una salita.','var(--amber)');}

     {l:'Fermati a toglierlo (richiamo sicuro)',f:()=>{addWarn('ti sei fermato a togliere il sasso');log('Togli il sasso. Il soldato prende nota.','var(--red)');}},

const MW=160,MH=135,MK=MW/(73*.616);

let MAPBASE=null;
function buildMap(){
  const c=document.createElement('canvas');c.width=MW;c.height=MH;const g=c.getContext('2d');
  g.fillStyle='#000';g.fillRect(0,0,MW,MH);
  const poly=(pts,col)=>{g.fillStyle=col;g.beginPath();pts.forEach((p,i)=>{const[x,y]=proj(p);i?g.lineTo(x,y):g.moveTo(x,y);});g.closePath();g.fill();};
  LAND.forEach(p=>poly(p,'#fff'));SEA.forEach(p=>poly(p,'#000'));
  const d=g.getImageData(0,0,MW,MH),a=d.data,land=new Uint8Array(MW*MH);
  for(let i=0;i<MW*MH;i++)land[i]=a[i*4]>127?1:0;
  for(let y=0;y<MH;y++)for(let x=0;x<MW;x++){const i=y*MW+x,o=i*4;let col;
    if(land[i]){const coast=(x>0&&!land[i-1])||(x<MW-1&&!land[i+1])||(y>0&&!land[i-MW])||(y<MH-1&&!land[i+MW]);col=coast?[58,46,38]:((x*3+y*5)%11===0?[118,104,78]:[104,92,70]);}
    else col=(x+y*2)%9===0?[34,52,72]:[26,40,58];
    a[o]=col[0];a[o+1]=col[1];a[o+2]=col[2];a[o+3]=255;}
  g.putImageData(d,0,0);
  g.fillStyle='rgba(255,255,255,.05)';for(let x=0;x<MW;x+=16)g.fillRect(x,0,1,MH);for(let y=0;y<MH;y+=16)g.fillRect(0,y,MW,1);
  MAPBASE=c;
}
function drawMap(c,prog){
  if(!MAPBASE)buildMap();const g=c.getContext('2d');g.imageSmoothingEnabled=false;g.drawImage(MAPBASE,0,0);
  const pts=ROUTE.c.map(n=>proj(CITY[n]));
  let segs=[],tot=0;for(let i=1;i<pts.length;i++){const l=Math.hypot(pts[i][0]-pts[i-1][0],pts[i][1]-pts[i-1][1]);segs.push(l);tot+=l;}
  let left=tot*prog,step=0;
  for(let i=1;i<pts.length&&left>0;i++){const[a,b]=[pts[i-1],pts[i]],l=segs[i-1],n=Math.ceil(l);
    for(let k=0;k<=n&&left>0;k++,left-=l/n,step++){if(step%3===2)continue;const t=k/n;g.fillStyle='#e0483a';g.fillRect(Math.round(a[0]+(b[0]-a[0])*t),Math.round(a[1]+(b[1]-a[1])*t),1,1);}}
  pts.forEach(([x,y],i)=>{const on=tot*prog>=segs.slice(0,i).reduce((s,v)=>s+v,0)-.5;if(!on)return;g.fillStyle='#000';g.fillRect(Math.round(x)-2,Math.round(y)-2,4,4);g.fillStyle=i===0?'#86b85e':i===pts.length-1?'#e8a838':'#f4ecd0';g.fillRect(Math.round(x)-1,Math.round(y)-1,2,2);});
  if(prog>=1){const lab=(n,[x,y],col)=>{const s=n.toUpperCase().replace(/[^A-Z ]/g,''),w=s.length*4;let lx=clamp(Math.round(x)-w/2,1,MW-w-1),ly=y<14?Math.round(y)+4:Math.round(y)-8;g.fillStyle='rgba(0,0,0,.6)';g.fillRect(lx-1,ly-1,w+1,7);ptextC(g,s,lx,ly,col);};

}

let rotOk=false;
let lastTurn=null;
function checkRot(){const portrait=window.innerHeight>window.innerWidth*1.05,turn=portrait&&!rotOk;app.classList.toggle('turn',turn);$('rot').classList.remove('on');
  if(turn!==lastTurn){lastTurn=turn;requestAnimationFrame(()=>{fit();if(sc.classList.contains('title')){const t=$('tcv');if(t)drawTitleArt(t);}});}}
$('rotOk').addEventListener('click',()=>{rotOk=true;checkRot();});
const toastEl=document.createElement('div');toastEl.id='toast';app.appendChild(toastEl);
function toast(m,ms=3500){toastEl.textContent=m;toastEl.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>toastEl.style.display='none',ms);}
async function goFull(){
  const el=document.documentElement;let ok=false;
  try{if(el.requestFullscreen){await el.requestFullscreen({navigationUI:'hide'});ok=true;}else if(el.webkitRequestFullscreen){el.webkitRequestFullscreen();ok=true;}}catch(e){}
  if(ok){try{await screen.orientation.lock('landscape');rotOk=true;checkRot();}catch(e){}}
  else toast('Qui dentro Claude lo schermo intero non è permesso. Gira il telefono: il gioco si mette in orizzontale da solo. Per lo schermo intero vero usa la versione installabile.',6000);
}

const ERR=document.createElement('div');ERR.style.cssText='position:absolute;left:0;right:0;top:0;z-index:30;background:#7a1010;color:#fff;font-size:11px;padding:6px;display:none;white-space:pre-wrap';app.appendChild(ERR);
function showErr(e){ERR.style.display='block';ERR.textContent='ERRORE (mandami uno screenshot): '+((e&&(e.message||e))||'sconosciuto')+(e&&e.stack?'\n'+String(e.stack).split('\n').slice(0,3).join('\n'):'');}
window.addEventListener('error',e=>showErr(e.error||e.message));
let last=performance.now();
function frame(){
  const now=performance.now(),dt=clamp((now-last)/1000,0,.1);last=now;
  try{
    if(S){
      if(!isFinite(S.speed))S.speed=0;
      if(S.mode==='play'){update(dt);hud();}
      else if(S.mode==='count'){countdown(dt);hud();}
      else if(S.mode==='dying'){S.t+=dt*.2;if(S.flash){S.flash.t-=dt;if(S.flash.t<=0)S.flash=null;}
        S.anim+=dt*4;S.npcs.forEach(n=>{if(n.alive&&!n.leaving)n.off+=n.v/SR*dt*1.6;});if(S.chat){S.chat.t-=dt;if(S.chat.t<=0)S.chat=null;}  // gli altri proseguono senza di te
        if(S.tankRoll&&!S.dead){S.truckX+=46*dt;if(S.truckX+28>=PX+5){S.dead=true;sfx.crush();buzz([200,80,300]);setTimeout(()=>{if(S&&!S.ended){S.ended=1;end(false);}},1800);}}}
      drawWorld();
    }
  }catch(e){showErr(e);}
  requestAnimationFrame(frame);
}
document.addEventListener('visibilitychange',()=>{last=performance.now();});
fit();titleScreen();
requestAnimationFrame(frame);

 futuro2:{t:"Io mi vedo con dei figli. Gli racconterò di te, non della Marcia.",o:[Q("«Raccontagli che ridevamo.»",D(10,8)),Q("«Non raccontargli niente di tutto questo.»",D(8,4))]},

/* ---- fraterno: chiacchiere del più e del meno, nuovi discorsi profondi, discorsi "malati" verso la fine ---- */
Object.assign(DEEP,{
 // chiacchiere
 c_cibo:{t:"Se potessi mangiare una cosa sola, adesso, cosa sceglieresti?",o:[Q("La pasta al forno della domenica.",D(6,5,'c_cibo2')),Q("Un'arancia fredda.",D(6,5,'c_cibo2')),Q("Non parlarmi di cibo, ti prego.",D(3,1))]},
 c_cibo2:{t:"Io un panino col salame grosso così. E una birra, anche se mia madre non vuole.",o:[Q("«Te lo offro io, quando arriviamo.»",D(8,6)),Q("Ridi e ti fa male la pancia.",D(6,7))]},

 c_stelle:{t:"Quella stella là, la vedi? La chiamo come te. Così ti trovo anche al buio.",o:[Q("«E quella vicina come te.»",D(10,7)),Q("«Scegline una più luminosa.»",D(8,6))]},

 c_scuola2:{t:"Io avevo un maestro che ci faceva marciare in cortile. Diceva che serviva. Bastardo, aveva ragione.",o:[Q("«Gli manderemo una cartolina.»",D(8,7)),Q("Non ridi. Non ce la fai.",D(4,1))]},
 c_animali:{t:"Hai mai avuto un cane? Io ne avevo uno, Bricco. Mangiava le pantofole.",o:[Q("«Io un gatto che mi odiava.»",D(6,6)),Q("«Mi sarebbe piaciuto.»",D(6,4)),Q("«Raccontami ancora di Bricco.»",D(8,6))]},
 c_gioco:{t:"Facciamo un gioco: ogni dieci passi dici una cosa bella. Inizio io: il pane caldo.",o:[Q("«Le lenzuola pulite.»",D(8,7)),Q("«La pioggia d'estate.»",D(8,7)),Q("«Non mi viene niente.»",D(3,-2))]},
 c_barzelletta:{t:"Sai quella del soldato che chiede la strada a un marciatore? No? Neanche io. Volevo solo farti sorridere.",o:[Q("Sorridi davvero.",D(8,7)),Q("«Funziona, sai.»",D(8,6))]},
 c_piedi:{t:"Facciamo a cambio di piedi per un'ora? I miei sono rovinati, ma almeno sono simpatici.",o:[Q("«Affare fatto.»",D(6,6)),Q("«I miei sono peggio, fidati.»",D(6,5))]},
 // nuovi discorsi profondi
 d_padre:{t:"Tuo padre... gli somigli? Io ho paura di diventare come il mio.",o:[Q("Sì, e ne sono fiero.",D(8,5,'d_padre2')),Q("Spero di no.",D(8,3,'d_padre2')),Q("Non l'ho mai conosciuto.",D(8,2,'d_padre2'))]},
 d_padre2:{t:"Se arriviamo in fondo, decidiamo noi chi diventare. Non loro. Né la Marcia.",o:[Q("«Lo decidiamo insieme.»",D(12,8)),Q("«Se arriviamo...»",D(6,2))]},
 d_colpa:{t:"Ho una cosa sulla coscienza. Una sola, ma pesa più dello zaino. Posso dirtela?",o:[Q("«Dimmela. Resta qui con me.»",D(10,4,'d_colpa2')),Q("«Tienila. Me la dirai alla fine.»",D(6,4))]},
 d_colpa2:{t:"Ho lasciato mio fratello da solo il giorno dell'estrazione. Avevo paura che prendessero anche lui. L'hanno preso me.",o:[Q("«Lo hai protetto, invece.»",D(12,7)),Q("Gli prendi la mano e camminate così.",D(14,6))]},
 d_ricordo:{t:"Qual è il ricordo più bello che hai? Me lo presti per un po'?",o:[Q("Gli racconti un'estate al mare.",D(10,8,'d_ricordo2')),Q("Gli racconti il primo bacio.",D(10,8,'d_ricordo2')),Q("«Non ne ho di belli.»",D(4,-3,'d_ricordo2'))]},
 d_ricordo2:{t:"Adesso ce l'ho anch'io. Se crollo, penserò a quello. È tuo, ma ne faccio buon uso.",o:[Q("«Tienilo. È un regalo.»",D(12,8)),Q("«Io terrò uno dei tuoi.»",D(10,7))]},
 d_corpo:{t:"Non sento più il corpo, {N}. Solo il cuore, e va forte. È normale?",o:[Q("«È normale. Siamo vivi.»",D(8,4,'d_corpo2')),Q("«Respira con me: dentro, fuori.»",D(10,6))]},
 d_corpo2:{t:"Allora contami i passi tu. Io conto i tuoi. Così nessuno si ferma.",o:[Q("«Uno, due, uno, due...»",D(10,8)),Q("Annuisci, e cominciate a contare.",D(10,7))]},
 // malati (verso la fine)
 m_ombre:{t:"Ci sono altri due che camminano con noi. Li vedi? Uno ha la tua faccia.",o:[Q("«Non c'è nessuno. Guardami.»",D(4,4,'m_ombre2')),Q("«Sì. Ci seguono da ore.»",D(8,-6,'m_ombre2')),Q("Non rispondi, e non ti volti.",D(2,-2))]},
 m_ombre2:{t:"Se li saluto, se ne vanno? O restano per sempre?",o:[Q("«Salutali. Poi guarda solo la strada.»",D(8,3)),Q("«Restano. E va bene così.»",D(8,-7))]},
 m_morto:{t:"Penso di essere già morto ieri sera. Dimmi la verità: tu riesci a toccarmi?",o:[Q("Gli stringi forte il braccio: «Sei qui.»",D(12,5)),Q("«Forse siamo morti tutti e due.»",D(8,-8,'m_morto2'))]},
 m_morto2:{t:"Allora è per questo che non sento i piedi. Che pace, eh?",o:[Q("«Svegliati! Cammina!»",D(6,3)),Q("«Che pace.»",D(6,-6))]},
 m_strada:{t:"La strada respira, {N}. Si gonfia e si sgonfia. Mettiti al passo con lei.",o:[Q("«È la stanchezza. Bevi.»",D(4,4)),Q("Provi a respirare con la strada.",D(8,-6)),Q("«Lo sento anch'io.»",D(8,-5,'m_strada2'))]},
 m_strada2:{t:"Quando arriviamo in fondo la strada ci mangia. Ma piano, con gentilezza.",o:[Q("«Nessuno ci mangia. Arriviamo e basta.»",D(6,4)),Q("«Con gentilezza.»",D(6,-7))]},
 m_soldato:{t:"Il soldato mi ha fatto l'occhiolino. Vuole che lo faccia. Dice che dopo è bello.",o:[Q("«Non ascoltarlo. Ascolta me.»",D(12,4,'m_soldato2')),Q("«Forse ha ragione...»",D(4,-10))]},
 m_soldato2:{t:"Ok. Allora parlami tu. Di qualsiasi cosa. Non smettere.",o:[Q("Gli parli di casa tua senza fermarti.",D(12,6)),Q("Gli racconti la tua prima bici.",D(12,6))]},
 m_nome:{t:"Come mi chiamo? Non me lo ricordo più. Tu ce l'hai ancora il mio nome?",o:[Q("«Ti chiami {ME}. Ripetilo con me.»",D(12,5)),Q("«Non importa più come ci chiamiamo.»",D(6,-6))]},
 m_neve:{t:"Sta nevicando. Senti? Fiocchi caldi, come cenere. Apri la bocca.",o:[Q("«Non nevica. Sono le tue ciglia.»",D(4,3)),Q("Apri la bocca al cielo.",D(8,-7)),Q("«È cenere. Chiudi gli occhi un secondo.»",D(6,-3))]},
});

/* ---- rimorso: un fraterno ti aveva salvato e tu l'hai lasciato morire ---- */
const GUILT=["“{X} mi ha rimesso in piedi. E io l'ho lasciat{o} crepare.”","“Sono un assassino. Non servono i cingoli per esserlo.”","“Ingrato. Ecco cosa sono. Un ingrato con le gambe.”","“Era {mio} {FR}. {Mio} {FR}! E io ho guardato altrove.”","“Mi sento una merda. Ogni passo è un passo che gli ho rubato.”","“Perché sono ancora vivo? Non me lo merito.”","“Sento ancora la sua mano sotto il braccio. Mi ha tirato su. Io no.”","“Se ci fosse un dio, mi fermerebbe adesso.”","“Smettila di guardarmi, {X}. Sei mort{o}. Smettila.”","“Ho scambiato la sua vita con la mia. Pessimo affare, {X}.”"];
const isFem=n=>['ilse','sofia','colette','zsofia'].includes(n.id);
function guiltFill(t,n){const f=isFem(n);return t.replace(/\{X\}/g,n.name).replace(/\{o\}/g,f?'a':'o').replace(/\{FR\}/g,f?'sorella':'fratello').replace(/\{mio\}/g,f?'mia':'mio').replace(/\{Mio\}/g,f?'Mia':'Mio');}
function betray(n){
  S.mh=Math.max(0,S.mh-30);S.guiltN=n;S.guiltT=S.t+120;S.guiltNext=S.t+4;sfx.bad();buzz([300,100,300]);
  log(guiltFill('Ti aveva salvato la vita. E tu l\'hai lasciat{o} morire.',n),'var(--red)');
  S.npcs.forEach(o=>{if(o.named&&o!==n&&o.alive&&!o.leaving)o.rel=clamp(o.rel-10,-100,100);});
  setTimeout(()=>{if(S&&S.mode==='play')log('Gli altri hanno visto. Nessuno ti guarda più negli occhi.','var(--dim)');},2500);
}
/* ---- archi degli amici: conversazioni a più battute con chi ti è amico (2 per personaggio: da Amico e da amicizia forte) ---- */
const ARCS={
 marek:[{
  x1:{t:"Sai perché ho le mani così, {N}? Non è il porto. È una cima che ho tenuto per sei ore, una notte d'inverno.",o:[Q("«Chi c'era dall'altra parte?»",D(6,2,'x2')),Q("«Sei ore? Impossibile.»",D(2,0,'x2'))]},
  x2:{t:"Mio padre. Era caduto tra la banchina e lo scafo. Io tenevo, lui parlava. Poi ha smesso di parlare. E io ho continuato a tenere.",o:[Q("Non dici niente. Cammini più vicino a lui.",D(10,3,'x3')),Q("«Non è stata colpa tua.»",D(8,2,'x3')),Q("«Perché me lo racconti adesso?»",D(4,0,'x3'))]},
  x3:{t:"Perché è la stessa cosa, qui. Tengo. Non so più per chi. Forse per te, adesso.",o:[Q("«Allora tieni. Io tengo te.»",D(14,6)),Q("«Tieni per te stesso, Marek.»".replace('Marek','{ME}'),D(8,4)),Q("«Non voglio che nessuno tenga per me.»",D(-6,-2))]}},
 {x1:{t:"Ti devo dire una cosa che non ho detto a nessuno. A Danzica... ho nascosto una ragazza nella stiva. Scappava dal Consiglio.".replace('Danzica','{CITY}'),o:[Q("«E poi?»",D(6,0,'x2')),Q("«Sei stato coraggioso.»",D(8,3,'x2'))]},
  x2:{t:"L'hanno trovata. Per colpa mia: ho parlato nel sonno, in branda, con un collega che faceva la spia. Lei aveva quindici anni.",o:[Q("«Non potevi saperlo.»",D(8,2,'x3')),Q("Gli metti una mano sulla spalla.",D(10,3,'x3')),Q("«Per questo sei qui. Te la sei cercata.»",D(-14,-4))]},
  x3:{t:"Quando mi hanno estratto ho pensato: giusto così. Poi ho conosciuto te. E adesso ho paura di morire. È una cosa brutta, avere di nuovo paura.",o:[Q("«È una cosa bella. Vuol dire che vuoi vivere.»",D(14,7)),Q("«La paura ci tiene svegli. Usala.»",D(10,5))]}}],
 ilse:[{
  x1:{t:"Tu mi credi fredda. Lo credono tutti. Vuoi sapere perché non piango?",o:[Q("«Sì. Dimmelo.»",D(6,1,'x2')),Q("«Non devi spiegarmi niente.»",D(8,2,'x2'))]},
  x2:{t:"Perché ho finito le lacrime a dodici anni. Il giorno che hanno preso mia madre per la requisizione dei medici. Non è più tornata.",o:[Q("«Mi dispiace, {ME}.»",D(8,2,'x3')),Q("«Io avrei pianto per anni.»",D(4,0,'x3')),Q("Le cammini accanto in silenzio.",D(10,3,'x3'))]},
  x3:{t:"Da allora mi sono costruita un muro. Tu ci hai fatto un buco. Non so se ringraziarti o odiarti.",o:[Q("«Ringraziami al traguardo.»",D(12,6)),Q("«Odiami pure, ma non chiudere il buco.»",D(14,5))]}},
 {x1:{t:"{N}... io non sono stata estratta.",o:[Q("«Cosa vuol dire?»",D(4,0,'x2')),Q("Ti fermi quasi, poi riprendi il passo.",D(4,-1,'x2'))]},
  x2:{t:"Era uscito il nome di mia sorella. Ha nove anni meno di me. Sono andata dal funzionario con tutti i miei risparmi. Ha cambiato il foglio.",o:[Q("«Hai preso il suo posto.»",D(10,2,'x3')),Q("«Sei la persona più coraggiosa che conosco.»",D(12,4,'x3')),Q("«Sei pazza. Potevi vivere.»",D(-4,-2,'x3'))]},
  x3:{t:"Se muoio, lei non saprà mai perché. Promettimi che se vinci tu, glielo racconti. Si chiama Liv.",o:[Q("«Te lo prometto. Ma lo racconterai tu.»",D(16,6)),Q("«Glielo racconterò ogni anno.»",D(14,4))]}}],
 ennio:[{
  x1:{t:"Ehi, {N}, vuoi sentire la barzelletta più bella del mondo? ...No, aspetta. Oggi non mi viene.",o:[Q("«Che succede, {ME}?»",D(8,1,'x2')),Q("«Dai, raccontala lo stesso.»",D(4,2,'x2'))]},
  x2:{t:"Mia madre sta morendo. Tumore. Le hanno dato due mesi a settembre. Io faccio il buffone perché se smetto di ridere, crollo qui per terra.",o:[Q("«Allora ridiamo insieme. Per lei.»",D(10,5,'x3')),Q("«Puoi crollare con me. Ti tengo io.»",D(12,3,'x3')),Q("«Non è il momento di pensarci.»",D(-6,-2,'x3'))]},
  x3:{t:"Se vinco, la Grazia porta medicine al paese. Medicine vere. Capisci perché non posso fermarmi? Anche se mi sanguinano i piedi.",o:[Q("«Allora non fermarti. Io cammino con te.»",D(14,6)),Q("«Arriverai. Te lo giuro.»",D(12,5))]}},
 {x1:{t:"Lo sai qual è la cosa che mi fa più paura? Non morire. È morire senza aver fatto ridere nessuno nell'ultimo minuto.",o:[Q("«Allora fai ridere me. Adesso.»",D(8,5,'x2')),Q("«Smettila di pensare all'ultimo minuto.»",D(4,2,'x2'))]},
  x2:{t:"Mio padre è morto sotto un camion militare. Stava raccontando una barzelletta, giuro. Gli mancava solo la battuta finale. Nessuno l'ha mai saputa.",o:[Q("«Inventiamola noi, la battuta finale.»",D(12,7,'x3')),Q("Ridi e piangi insieme, senza riuscire a smettere.",D(12,3,'x3'))]},
  x3:{t:"Ecco... ho trovato la battuta. Te la dico solo se arriviamo entrambi in fondo. Affare fatto?",o:[Q("«Affare fatto, {ME}.»",D(14,8)),Q("«Dimmela adesso. Non si sa mai.»",D(6,-2))]}}],
 dragan:[{
  x1:{t:"Non parlo molto, {N}. Ma con te sì. Durante la guerra avevo undici anni. Il mio villaggio, {CITY}, l'hanno bruciato in una notte.",o:[Q("«E tu dov'eri?»",D(6,0,'x2')),Q("«Non devi raccontarmelo.»",D(6,2,'x2'))]},
  x2:{t:"Nel pozzo. Mi ci ha calato mia sorella. Lei non c'entrava. Ho sentito tutto, da là sotto. Tutto.",o:[Q("Gli prendi il braccio, forte.",D(12,2,'x3')),Q("«Adesso sei fuori dal pozzo, Dragan.»".replace('Dragan','{ME}'),D(10,4,'x3')),Q("«Io non ce l'avrei fatta a vivere dopo.»",D(2,-4,'x3'))]},
  x3:{t:"Ho promesso a me stesso che non mi sarei più nascosto da niente. Per questo cammino in testa. Se vuoi, cammina dietro di me. Ti copro io.",o:[Q("«Cammino accanto a te. Non dietro.»",D(14,6)),Q("«Grazie, fratello.»",D(14,5))]}},
 {x1:{t:"C'è una cosa che devo dire a qualcuno prima di morire. Tu vai bene.",o:[Q("«Dimmi.»",D(4,0,'x2')),Q("«Non morirai.»",D(6,2,'x2'))]},
  x2:{t:"Dopo la guerra avevamo fame. Ho denunciato il vicino per un sacco di farina. Lo hanno portato via. Suo figlio è qui. Il numero ventitré. Lui non lo sa.",o:[Q("«Devi dirglielo.»",D(6,-2,'x3')),Q("«Eri un bambino affamato.»",D(10,4,'x3')),Q("«Sei un mostro.»",D(-16,-4))]},
  x3:{t:"Se cede, lo aiuterò io. Anche se mi costa un richiamo. Così forse il conto si chiude. Tu che dici?",o:[Q("«Dico che sei un uomo migliore di quanto credi.»",D(14,6)),Q("«Il conto non si chiude mai. Ma è un inizio.»",D(10,3))]}}],
 pieter:[{
  x1:{t:"Avevo un piano, {N}. Sedermi al primo chilometro. Senza drammi. Un gesto filosofico.",o:[Q("«E perché non l'hai fatto?»",D(6,1,'x2')),Q("«Che piano idiota.»",D(-4,-1,'x2'))]},
  x2:{t:"Perché al primo chilometro mi hai chiesto dell'acqua. Una cosa stupida. E io ho pensato: se mi siedo, chi gli risponde?",o:[Q("«Allora devo chiederti acqua più spesso.»",D(10,5,'x3')),Q("«Non camminare per me. Cammina per te.»",D(8,3,'x3'))]},
  x3:{t:"Non ho mai creduto in niente. Né Dio, né Stato, né amore. Adesso credo in una cosa sola: nel prossimo passo che facciamo insieme.",o:[Q("«È già una filosofia.»",D(14,6)),Q("«Il prossimo passo, allora. E quello dopo.»",D(14,7))]}},
 {x1:{t:"Ho scritto un libro, sai. Trecento pagine sul senso della vita. L'ho bruciato la notte prima della Marcia.",o:[Q("«Perché?»",D(4,0,'x2')),Q("«Peccato. L'avrei letto.»",D(8,3,'x2'))]},
  x2:{t:"Perché era tutto sbagliato. Il senso non si scrive. Si cammina. Ci sono arrivato a trecento chilometri da casa, con le scarpe rotte.",o:[Q("«E qual è il senso?»",D(6,2,'x3')),Q("«Scrivilo di nuovo, quando torni.»",D(10,4,'x3'))]},
  x3:{t:"Il senso è che qualcuno ti cammini accanto mentre crolli. Tutto qui. Trecento pagine per una riga. Non è ridicolo?",o:[Q("«È la riga più bella che abbia mai sentito.»",D(16,7)),Q("«Ridicolo. E vero.»",D(12,5))]}}],
 sofia:[{

  x2:{t:"Sicura. Ha la cicatrice a forma di esse. L'ho fatta storta, avevo le mani che tremavano. Gli ho salvato la vita. Adesso lui deciderà la mia.",o:[Q("«Diglielo. Forse si ricorda.»",D(4,-2,'x3')),Q("«Non dargli questa soddisfazione.»",D(10,3,'x3')),Q("Non sai cosa dire. Le stringi la mano.",D(12,3,'x3'))]},
  x3:{t:"Non me ne pento, sai. Anche se toccasse a lui spararmi alle gambe. Si cura chi sanguina. Punto. Promettimi che rimarrai una persona che cura, {N}.",o:[Q("«Te lo prometto.»",D(14,6)),Q("«Qui dentro è difficile, Sofia.»".replace('Sofia','{ME}'),D(8,2))]}},
 {x1:{t:"Posso dirti una cosa da infermiera? Hai le labbra bianche e cammini storto. Fra poco i tuoi piedi ti tradiranno.",o:[Q("«Lo so. Cosa faccio?»",D(8,3,'x2')),Q("«Pensa ai tuoi piedi.»",D(-6,0,'x2'))]},
  x2:{t:"Ascolta il corpo. Bevi prima di avere sete. Mangia prima della fame. E quando la testa ti dice di sederti... guardami. Io ti dirò di no.",o:[Q("«E chi dirà di no a te?»",D(12,4,'x3')),Q("«Grazie. Davvero.»",D(10,5,'x3'))]},

  x1:{t:"Stanotte non sono riuscito a pregare, {N}. Le parole non uscivano. È la prima volta in vita mia.",o:[Q("«Forse Dio sta zitto anche lui.»",D(4,-2,'x2')),Q("«Prega con me, allora. A modo mio.»",D(10,3,'x2'))]},
  x2:{t:"Mio fratello era seminarista. L'hanno portato via perché suonava le campane il giorno della Vittoria. Non è più tornato. Io ho continuato a pregare per tutti e due.",o:[Q("«Allora prega per tre, adesso. Anche per me.»",D(12,4,'x3')),Q("«E Dio dov'era?»",D(2,-3,'x3'))]},
