<style>
:root{--bg:#16121c;--panel:#241e2c;--panel2:#2e2738;--ink:#ece3c8;--dim:#8f8572;--red:#e0483a;--amber:#e8a838;--green:#86b85e;--blue:#5a9ad8}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
html,body{margin:0;height:100%;background:#000;color:var(--ink);font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;overflow:hidden;touch-action:none;overscroll-behavior:none}
#app{position:relative;height:100vh;height:100dvh;display:flex;flex-direction:column;overflow:hidden;background:var(--bg);padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
#stage{position:relative;flex:1;min-height:0}
#cdn{display:none;top:42%!important;transition:none!important;transform:translate(-50%,-50%);z-index:3;pointer-events:none}
#cdn.pop{animation:cdpop .9s steps(6,end)}
@keyframes cdpop{0%{transform:translate(-50%,-50%) scale(1.3);opacity:1}70%{opacity:1}100%{transform:translate(-50%,-50%) scale(1);opacity:.15}}
#fx{position:absolute;left:0;top:0;width:100%;height:100%;image-rendering:pixelated;pointer-events:none;z-index:1}
#chatd{position:absolute;display:none;transform:translate(-50%,-100%);background:#f4f4f0;color:#7a0a0a;border:2px solid #000;padding:3px 6px;font-size:10px;font-style:italic;pointer-events:none;z-index:2;box-shadow:2px 2px 0 #000;white-space:nowrap}

#chatb:after{content:'';position:absolute;left:50%;bottom:-6px;margin-left:-3px;border:3px solid transparent;border-top-color:#000}

.bars{display:grid;grid-template-columns:auto 1fr;gap:2px 6px;align-items:center;margin-top:4px;font-size:9px}
.bar{position:relative;height:7px;background:#0c0a10;border:2px solid #000}
.bar .fill{position:absolute;top:0;bottom:0;left:0}

#alert{position:absolute;top:6px;right:8px;font-size:11px;font-weight:700;color:var(--amber);background:rgba(22,18,28,.75);padding:2px 6px}
#alert:empty{display:none}
#mute{background:none;border:0;box-shadow:none;padding:0 2px;font-size:13px}
#bottom{display:flex;height:31vh;min-height:92px;max-height:170px;gap:6px;padding:6px;flex:none;background:var(--bg);border-top:2px solid #000}
#center{flex:1.6;display:flex;flex-direction:column;gap:5px;min-width:0}
#log{flex:1;overflow:hidden;min-height:0}
#log div{font-size:11.5px;line-height:1.3;margin-bottom:2px}

#inv{display:flex;gap:4px;flex:none}

.pad{flex:1;border:3px solid #000;background:var(--panel);display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:800;font-size:13px;color:var(--dim);touch-action:none}
.pad.next{background:#3a3248;color:var(--ink);box-shadow:inset 0 0 0 3px var(--amber)}
.pad.hit{background:#5a4e6a}.pad.bad{background:#5a1e1a}

.box{position:absolute;top:6px;left:50%;transform:translateX(-50%);width:min(600px,94%);max-height:calc(100% - 12px);background:var(--panel2);border:2px solid #000;box-shadow:inset 0 0 0 2px #4a405a,0 4px 0 rgba(0,0,0,.5);padding:7px;display:flex;flex-direction:column;gap:5px;z-index:3}
.box .hd{display:flex;gap:8px;align-items:center;flex:none}
.box canvas{width:30px;height:30px;image-rendering:pixelated;border:2px solid #000;background:#3a3248;flex:none}
.box .nm{font-weight:800;font-size:13px}
.box .rl{font-size:11px;color:var(--dim)}
.box .tx{font-size:13px;line-height:1.3;flex:1 1 auto;min-height:16px;overflow:auto}
.box .tm{height:4px;background:#0c0a10;flex:none}

.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:4px;flex:none}
.opts button{padding:6px 8px;font-size:12px}
button{font:inherit;color:var(--ink);background:#3a3248;border:2px solid #000;box-shadow:inset 0 -3px 0 #231d2c;padding:8px;text-align:left;font-size:12.5px;cursor:pointer}
button:active{transform:translateY(1px);box-shadow:inset 0 -1px 0 #231d2c}

.qte{align-items:center;text-align:center}
.qte .tx{flex:none}
.qte .big{font-size:18px;font-weight:800;color:var(--amber)}
.qte button.main{text-align:center;font-size:16px;font-weight:800;background:var(--amber);color:#1a1410;padding:10px 22px}
.track{position:relative;width:80%;height:16px;background:#0c0a10;border:2px solid #000;flex:none}
.track .zone{position:absolute;top:0;bottom:0;background:var(--green)}
.track .mk{position:absolute;top:-4px;bottom:-4px;width:4px;background:var(--ink)}
/* schermate */
#screen{position:absolute;inset:0;background:rgba(14,10,18,.97);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:16px 22px;text-align:center;z-index:5;overflow:auto}

#screen h2{font-size:12px;color:var(--dim);margin:0 0 12px;font-weight:400;letter-spacing:1px}
#screen p{font-size:13px;line-height:1.5;margin:0 0 10px;max-width:520px}
#screen button.main{text-align:center;background:var(--amber);color:#1a1410;font-weight:800;font-size:16px;padding:12px 26px}

#screen .row3{display:flex;gap:8px;width:100%;max-width:560px;margin-bottom:14px}
#screen .row3 button{flex:1;text-align:center;font-size:15px;font-weight:700;padding:12px 4px}
#screen table{font-size:12px;margin:0 auto 12px;border-collapse:collapse}
#screen td{padding:1px 8px;text-align:left}
#screen.title{background:#000;padding:0;justify-content:flex-start}
#tcv{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated;image-rendering:crisp-edges}
.ttl{position:absolute;left:50%;top:-25%;transform:translateX(-50%);margin:0;image-rendering:pixelated;image-rendering:crisp-edges;transition:top 5s steps(16,end)}
#screen.title #go{position:absolute;bottom:8%;left:50%;transform:translateX(-50%);white-space:nowrap}
#juke{position:absolute;inset:6% 8%;background:#120e16f2;border:2px solid #4a405a;padding:8px;overflow:auto;z-index:5;text-align:left}
#juke .jh{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;font-size:12px}
#juke .jh button{padding:3px 8px;font-size:10px}

#juke .jl button{text-align:left;padding:6px 8px;font-size:12px}

#jukeHud{background:none;border:0;box-shadow:none;padding:0 2px;font-size:13px;display:none}
#screen.title .dbg{position:absolute;right:6px;bottom:4px;font-size:10px;color:#8a7a8a;text-align:right;display:flex;flex-direction:column;gap:3px;align-items:flex-end}
#screen select{font:inherit;background:#3a3248;color:var(--ink);border:2px solid #000;padding:2px;font-size:10px}
#screen.intro{background:#0a080c;cursor:pointer}
.crawl{position:absolute;left:50%;top:100%;width:min(640px,86%);transform:translateX(-50%);text-align:center;font-size:15px;line-height:1.75;white-space:pre-wrap;color:#e8dcc0;animation:crawl 36s linear forwards}
.crawl::first-line{color:var(--amber);font-weight:800}
@keyframes crawl{from{top:100%;transform:translate(-50%,0)}to{top:0;transform:translate(-50%,-100%)}}
#screen.intro{overflow:hidden}
.intro-tx{max-width:640px;text-align:left;font-size:14px;line-height:1.6;white-space:pre-wrap;color:#e8dcc0}
.skip{position:absolute;bottom:10px;right:14px;font-size:11px;animation:blink 1.2s steps(2) infinite}
@keyframes blink{50%{opacity:.2}}
.mapwrap{display:flex;gap:18px;align-items:center;justify-content:center;width:100%;height:100%}
#mcv{height:min(86%,520px);max-width:58%;aspect-ratio:160/135;image-rendering:pixelated;border:3px solid #000;background:#1a2a3a}
.minfo{text-align:left;max-width:340px}

#rot.on{display:flex}
#app.turn{position:fixed;left:0;top:0;width:100vh;height:100vw;transform-origin:0 0;transform:translateX(100vw) rotate(90deg);padding:0}
.fsb{background:none;border:0;box-shadow:none;padding:0 2px;font-size:13px}
#toast{position:absolute;left:50%;bottom:36%;transform:translateX(-50%);background:#2e2738;border:2px solid #000;padding:8px 12px;font-size:12px;z-index:40;max-width:80%;text-align:center;display:none}
@media (max-height:340px){#hud{font-size:10px}#bottom{min-height:80px}.pad svg{width:22px;height:22px}#inv button{padding:3px 2px;font-size:10px}}
#rot .ph{font-size:46px;animation:rot 2s ease-in-out infinite}
@keyframes rot{0%,30%{transform:rotate(0)}60%,100%{transform:rotate(-90deg)}}
@media (orientation:portrait){.mapwrap{flex-direction:column}#mcv{height:auto;width:90%;max-width:90%}}
.hide{display:none!important}
</style>
</head>
<body>
<div id="app">

<script>
(()=>{

const offMin=()=>-(PX-40)/SPR, offMax=()=>(W-PX-10)/SPR;

/* ================= EPOCHE (ogni 5 gare = 5 anni) ================= */
const ERAS=[
 {from:1980,name:'Anni \'80 · I',shirts:['#e84a7a','#3ac8c8','#f0c838','#8a5ad8','#e86a2a','#4ab84a','#e8e8e8'],pants:'#2a3a6a',band:true,veh:'apc',vc:'#4a5a34',helm:'#2e3a24',poster:['#b83a2a','#e8d8a0'],

 {from:1995,name:'Anni \'90 · II',shirts:['#5ab8a8','#a83a8a','#e8e8e8','#3a3a3a','#c8b838','#3a6ab8','#e86a3a'],pants:'#2a2a2a',veh:'car',vc:'#3a3a34',helm:'#2a2a2a',poster:['#e8c838','#1a1a1a'],
  r:{label:'una canzone pop',bpm:100,wave:'triangle',bass:'triangle',root:262,scale:[0,2,4,7,9],prog:[0,-5,-3,-7],pat:[2,null,2,3,4,null,null,null,4,null,3,2,1,null,null,null],drums:'back',bm:'root'},

function buildPlan(){
  const c=ROUTE.c,rur=RURAL[ROUTE.wx]||['campagna'],P=[];let last='';
  const pool=ROUTE.sea?[...rur,'mare','mare']:rur;
  const rural=()=>{let z;do{z=pick(pool);}while(z===last&&pool.length>1);last=z;P.push({z,dur:rand(90,140)});};
  if(Math.random()<.65){P.push({z:'citta',dur:180,name:c[0]});P.push({z:'periferia',dur:rand(60,90)});}
  else{P.push({z:'villaggio',dur:rand(60,90),name:c[0],rural:1});}
  for(let i=1;i<c.length-1;i++){rural();rural();P.push({z:'periferia',dur:40});P.push({z:'citta',dur:90,name:c[i]});P.push({z:'periferia',dur:40});}
  for(let k=0;k<8;k++)rural();
  return P;
}

let AC=null,NOISE=null,MUTE=store.get('up_mute',false);
function initAudio(){try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();const p=AC.resume&&AC.resume();if(p&&p.catch)p.catch(()=>{});
  if(!NOISE){NOISE=AC.createBuffer(1,AC.sampleRate*.6,AC.sampleRate);const d=NOISE.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/d.length,3);}
  startMusic();}catch(e){AC=null;}}
function tone(f,d,type='square',v=.05,f2,delay=0,abs){if(!AC||MUTE)return;try{const t0=abs!=null?abs:AC.currentTime+delay,o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.setValueAtTime(f,t0);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t0+d);g.gain.setValueAtTime(v,t0);g.gain.exponentialRampToValueAtTime(.0001,t0+d);o.connect(g);g.connect(AC.destination);o.start(t0);o.stop(t0+d+.02);}catch(e){}}
function noise(v=.4,d=.4,abs,freq=1800){if(!AC||!NOISE||MUTE)return;try{const s=AC.createBufferSource(),g=AC.createGain(),f=AC.createBiquadFilter();f.type='lowpass';f.frequency.value=freq;s.buffer=NOISE;g.gain.value=v;s.connect(f);f.connect(g);g.connect(AC.destination);const t=abs!=null?abs:AC.currentTime;s.start(t);s.stop(t+d);}catch(e){}}

/* [DEV] jukebox di debug — da togliere nella versione pubblica */
let JUKE=null;
let _TR=null;const TRACKS=()=>_TR||(_TR=ERAS.flatMap(e=>[{n:e.from+' · sottofondo ('+e.name+')',m:e.m},...(e.r?[{n:e.from+' · radio: '+e.r.label,m:e.r},{n:e.from+' · radio guasta a metà',m:{...e.r,dist:.5}},{n:e.from+' · radio guasta (finale)',m:{...e.r,dist:1}}]:[])]));
function radioDist(m){if(m&&m.dist!=null)return m.dist;if(!S||!S.radio||!ERA.r||m!==ERA.r||(S.mode!=='play'&&S.mode!=='dying'))return 0;return clamp((progress()-.15)/.85,0,1);}
function startMusic(){if(!AC||MUS.timer)return;MUS.next=AC.currentTime+.1;MUS.timer=setInterval(()=>{try{if(!AC)return;const m=JUKE||((S&&S.radio&&ERA.r)?ERA.r:ERA.m),spb=60/m.bpm/4*(1+.55*radioDist(m));
  if(MUS.next<AC.currentTime)MUS.next=AC.currentTime+.05;
  let guard=0;while(MUS.next<AC.currentTime+.25&&guard++<16){playStep(MUS.step,MUS.next,m,spb);MUS.next+=spb;MUS.step++;}}catch(e){}},60);}
function playStep(i,t,m,spb){
  if(MUTE||(!JUKE&&(!S||S.mode!=='play')))return;
  /* radio che si guasta: più la marcia è disperata (filtro grigio), più la musica si stona, rallenta, scende e diventa inquietante */
  const D=radioDist(m);
  const tn=(f,d,w,v,f2,dl,tt)=>{if(D>0){if(Math.random()<D*.35)return;const det=Math.pow(2,(Math.random()-.5)*D*1.4/12);f*=det;d*=1+D*.8;if(D>.55)w='sawtooth';v*=1-D*.25;if(D>.25&&!f2)f2=f*(1-D*.14);}tone(f,d,w,v,f2,dl,tt);};
  const nz=(v,d,tt,fr)=>{if(D>0){if(Math.random()<D*.3)return;fr=(fr||1800)*(1-D*.75);d*=1+D;}noise(v,d,tt,fr);};
  const bar=Math.floor(i/16)%4,s=i%16,root=m.root*Math.pow(2,(m.prog[bar]-D*5)/12);
  if(D>.45&&s===0){tone(root/4*1.414,spb*16*(1+D),'sawtooth',.025*D,root/4*1.33,0,t);tone(root*2.12,spb*12,'sine',.012*D,root*1.9,0,t+spb*4);}
  if(D>.7&&s===8&&Math.random()<.5)noise(.12*D,1.2,t,400);
  if(m.drums){const kick=()=>tn(80,.1,'sine',.12,40,0,t),hat=v=>nz(v,.04,t,7000),snare=(v,d)=>nz(v,d,t,2800),B=(f,d)=>tn(f,d,m.bass,.045,null,0,t);
    if(m.drums==='four'){if(s%4===0)kick();if(s%4===2)hat(.06);if(s%8===4)snare(.1,.08);}
    else if(m.drums==='gated'){if(s===0||s===10)kick();if(s%8===4)snare(.2,.22);if(s%2===0)hat(.03);}
    else if(m.drums==='back'){if(s===0||s===6||s===8)kick();if(s%8===4)snare(.12,.1);if(s%2===0)hat(.035);}
    else if(m.drums==='half'){if(s===0||s===3)kick();if(s===8)snare(.18,.18);hat(s%2?.02:.04);}
    if(m.bm==='oct'){if(s%2===0)B(root/(s%4===0?4:2),spb*1.6);}
    else if(m.bm==='eighth'){if(s%2===0)B(root/4,spb*1.5);}
    else if(m.bm==='off'){if(s%4===2)B(root/2,spb*1.8);}
    else if(m.bm==='pump'){if(s%4!==0)B(root/4,spb*.8);}
    else if(m.bm==='root'){if(s%8===0)B(root/4,spb*6);}
    else if(m.bm==='long'){if(s%8===0)tn(root/4,spb*7,m.bass,.05,root/3,0,t);}}
  else if(m.dirge){if(s%8===0)tn(root/2,spb*7,m.bass,.045,null,0,t);if(s===0||s===8)tn(55,.35,'sine',.09,40,0,t);}
  else if(s%4===0)tn(root/2,spb*3,m.bass,.05,null,0,t);
  const p=m.pat[s];if(p!=null){const oct=Math.floor(p/m.scale.length);tn(root*Math.pow(2,(m.scale[p%m.scale.length]+12*oct)/12),m.dirge?spb*3.5:spb*.9,m.wave,m.dirge?.014:.018,null,0,t);}
  if(m.drum&&!m.drums){if(s%8===4)nz(.08,.06,t,4000);if(s%8===0)tn(70,.08,'sine',.08,40,0,t);}
}

function eat(st,mh,ph,msg){
  S.st=Math.min(S.maxSt,S.st+st);S.mh=Math.min(100,S.mh+mh);S.ph=Math.min(100,S.ph+ph);sfx.eat();
  const full=S.sto>45;S.sto+=30;log(msg,'var(--green)');
  if(full&&Math.random()<(1-S.tr.s/100)*1.1)setTimeout(()=>{if(!S||S.mode!=='play')return;S.hy=Math.max(0,S.hy-20);S.st=Math.max(0,S.st-12);S.mh-=8;S.speed=Math.max(0,S.speed-2);S.steps=[];sfx.bad();buzz(200);log('Hai mangiato troppo e troppo in fretta. Vomiti camminando.','var(--red)');},2500);
}
function cadence(){const st=S.steps;if(st.length<2)return 0;const n=Math.min(st.length-1,4);let sum=0;for(let i=st.length-n;i<st.length;i++)sum+=st[i]-st[i-1];const since=S.t-st[st.length-1];if(since>2)return 0;return 1/Math.max(sum/n,since,.15);}

/* ================= BOX: QTE / SCELTE / DIALOGHI ================= */
const box=$('box'),app=$('app');
function showBox(cls,html){box.className=cls;box.innerHTML=html;}
function hideBox(){box.className='box hide';}
function relUp(n,d){const before=relLabel(n.rel);n.rel=clamp(n.rel+d,-100,100);const after=relLabel(n.rel);
  if(after!==before&&after==='Fraterno'){S.bro=true;n.buddy=n.buddy||pick([-5,-4,4,5]);n.lane=pick([2,3]);log(n.name+' ora è come un fratello per te.','var(--green)');}
  else if(after!==before&&after==='Amico')log(n.name+' ora è tuo amico.','var(--green)');}
const HELP={crampo:'{n} ti massaggia la gamba mentre camminate.',caduta:'{n} ti afferra prima che tu cada.',isteria:'{n} ti stringe la mano: «Respira con me.»',blocco:'{n} ti spinge avanti: «Muoviti, dai!»',spinta:'{n} si mette in mezzo e ti tiene in piedi.'};
function startQTE(type,who){
  /* 1 volta su 4 un amico ti aiuta da solo (e l'amicizia cresce) */
  if(HELP[type]){const fr=friends();if(fr.length&&Math.random()<.25){const f=pick(fr);S.qte={type,who,t:0,n:0};log(HELP[type].replace('{n}',f.name),'var(--green)');endQTE(true);relUp(f,6);return;}}
  const q={type,t:0,who,n:0};
  Object.assign(q,{
   crampo:{dur:3.6,need:8,title:'CRAMPO!',sub:'Massaggia il polpaccio camminando',btn:'MASSAGGIA'},
   caduta:{dur:1.6,title:'INCIAMPI!',sub:'Ritrova l\'equilibrio quando il segno è nel verde',btn:'EQUILIBRIO',timing:true},
   acqua:{dur:1.8,title:'ACQUA DALLA FOLLA!',sub:'Un vecchio tende una bottiglia oltre il filo spinato',btn:'AFFERRA'},
   spinta:{dur:2.2,need:5,title:(who||'').toUpperCase()+' TI SPINGE!',sub:'Resta in piedi',btn:'RESISTI'},
   isteria:{dur:4,need:7,title:'PANICO',sub:'Il cuore impazzisce. Respira.',btn:'RESPIRA'},
   blocco:{dur:4,need:10,title:'LE GAMBE NON SI MUOVONO',sub:'Tutti partono. Tu no. Sbloccati!',btn:'MUOVITI'},
   salva:{dur:3.2,need:9,title:'SORREGGI '+(who||'').toUpperCase()+'!',sub:'Tienilo in piedi senza rallentare',btn:'SORREGGI'},
  }[type]);
  if(q.timing){q.z0=rand(.45,.65);q.z1=q.z0+.17;}
  S.qte=q;
  showBox('box qte',`<div class="big">${q.title}</div><div class="tx">${q.sub}</div>${q.timing?`<div class="track"><div class="zone" style="left:${q.z0*100}%;width:${(q.z1-q.z0)*100}%"></div><div class="mk" id="mk"></div></div>`:''}${q.need?`<div class="tx" id="qn">0 / ${q.need}</div>`:''}<button class="main" id="qb">${q.btn}</button><div class="tm" style="width:80%"><b id="qt"></b></div>`);
  $('qb').addEventListener('pointerdown',e=>{e.preventDefault();qteHit();});
  sfx.tick();buzz(40);
}
function qteHit(){const q=S.qte;if(!q)return;
  if(q.need){q.n++;sfx.tick();const el=$('qn');if(el)el.textContent=q.n+' / '+q.need;if(q.n>=q.need)endQTE(true);}
  else if(q.timing){const p=q.t/q.dur;endQTE(p>=q.z0&&p<=q.z1);}else endQTE(true);}
const friends=()=>S.npcs.filter(n=>n!==S.dyingNpc&&n.named&&n.alive&&!n.leaving&&n.rel>=40);
function endQTE(ok){
  const q=S.qte;S.qte=null;hideBox();const G='var(--green)',Rd='var(--red)';
  if(q.type==='salva'){const n=S.saving;if(!n)return;
    if(ok){sfx.good();log('Lo tieni su. Un passo, poi un altro.',G);}else{sfx.bad();buzz(120);n.saveFail=true;log('Rallenti per reggerlo.',Rd);addWarn();}
    n.saveLeft--;
    if(n.saveLeft>0&&S.mode==='play')setTimeout(()=>{if(S&&S.mode==='play'&&!S.qte&&n.alive)startQTE('salva',n.name);else finishSave(n);},1200);else finishSave(n);
    return;}
  if(ok){sfx.good();({acqua:()=>{S.hy=Math.min(100,S.hy+20);S.bl+=8;log('Bevi avidamente.',G);},crampo:()=>log('Il crampo si scioglie.',G),caduta:()=>log('Barcolli ma resti in piedi.',G),
      spinta:()=>log('Resti in piedi. '+q.who+' sbuffa.',G),isteria:()=>{S.mh+=4;log('Il respiro torna regolare.',G);},blocco:()=>log('Le gambe ripartono.',G)})[q.type]();return;}
  sfx.bad();buzz(120);
  if(q.type==='acqua'){log('La bottiglia cade nella polvere.','var(--dim)');return;}
  if(q.type==='blocco'){log('Sei rimasto fermo troppo a lungo.',Rd);addWarn();return;}
  const fr=friends();
  if(fr.length&&Math.random()<.5){log(pick(fr).name+' ti sorregge per un braccio.',G);S.speed-=.8;S.st-=5;return;}
  if(q.type==='crampo'){S.st-=18;S.ph-=4;S.speed-=2;log('Il crampo ti morde la gamba.',Rd);}
  if(q.type==='caduta'){S.ph-=10;S.speed-=3;S.steps=[];if(Math.random()<.3){S.injury=true;log('Cadi sull\'asfalto. Il ginocchio sanguina.',Rd);}else log('Cadi e ti rialzi di scatto.',Rd);}
  if(q.type==='spinta'){S.st-=10;S.speed-=3;S.steps=[];log('Barcolli. '+q.who+' ride.',Rd);}
  if(q.type==='isteria'){S.mh-=10;S.speed-=2.5;S.steps=[];log('Urli qualcosa che non ricorderai. I soldati ti guardano.',Rd);}
  S.st=Math.max(0,S.st);S.speed=Math.max(0,S.speed);
}

function askSave(n){n.saveAsked=true;n.savePending=true;
  choice(n.name.toUpperCase()+' STA CEDENDO',n.name+' barcolla, gli occhi rovesciati. Se lo lasci, i soldati lo finiranno.',[
    {l:'Lo sorreggi',f:()=>{n.savePending=false;S.saving=n;n.saveLeft=Math.random()<.5?1:2;n.saveFail=false;startQTE('salva',n.name);}},
    {l:'Lo lasci andare',f:()=>{n.savePending=false;n.leaving=1;S.mh-=12;log('Lasci la sua mano. Non ti volti.','var(--red)');}}],8,1);}
function finishSave(n){S.saving=null;if(!n.alive||n.leaving)return;
  if(n.saveFail){n.leaving=1;S.mh-=10;log(n.name+' ti scivola via dalle braccia.','var(--red)');}
  else{n.elimAt=S.t+rand(150,300);S.mh=Math.min(100,S.mh+10);relUp(n,10);log(n.name+' riprende fiato: «Ti devo la vita.»','var(--green)');}}

  drawFace($('face').getContext('2d'),npc);
  box.querySelectorAll('.opts button').forEach(b=>b.addEventListener('pointerdown',e=>{e.preventDefault();answer(+b.dataset.i);}));

function answer(i){
  const g=S.dlg;if(!g)return;S.dlg=null;hideBox();const npc=g.npc;
  if(g.kind==='bigot'){const o=i<0?g.d.o.find(x=>x.def):g.d.o[i];npc.rel=clamp((npc.rel||0)+o.r,-100,100);S.mh=clamp(S.mh+o.m,0,100);if(o.s)S.st=clamp(S.st+o.s,0,S.maxSt);
    log(o.f,o.m>0?'var(--green)':o.m>=-1?'var(--dim)':'var(--red)');
    const fr=friends();if(fr.length&&Math.random()<.65){const f=pick(fr);setTimeout(()=>{if(!S||S.mode!=='play')return;S.mh=Math.min(100,S.mh+8);f.rel=Math.min(100,f.rel+4);log(f.name+' si mette in mezzo: '+pick(DEFEND),'var(--green)');sfx.good();},1800);}
    return;}
  if(i>=0&&g.d.o[i].out&&!S.outed){S.outed=true;setTimeout(()=>{if(S&&S.mode==='play')log('Qualcuno ha sentito. La voce corre lungo la fila.','var(--dim)');},2500);}
  if(g.kind==='mad'){if(i<0){S.mh=Math.max(0,S.mh-2);log('Lo lasci parlare da solo. Continua lo stesso.','var(--dim)');return;}const o=g.d.o[i];relUp(npc,o.r);S.mh=clamp(S.mh+o.m,0,100);
    log(o.m>0?npc.name+' sbatte le palpebre, come se si svegliasse.':o.m<-4?'Per un attimo ci credi anche tu.':npc.name+' sorride a qualcuno che non c\'è.',o.m>0?'var(--green)':o.m<-4?'var(--red)':'var(--dim)');return;}
  if(g.kind==='loveq'){if(i<0){log(npc.name+' alza le spalle.','var(--dim)');return;}const o=g.d.o[i];npc.rel=clamp(npc.rel+o.r,-100,100);S.mh=clamp(S.mh+o.m,0,100);
    if(o.out){const ok=npc.rel>=0&&Math.random()<.75;npc.rel=clamp(npc.rel+(ok?8:-18),-100,100);log(npc.name+(ok?' sorride: «Allora spero che ti aspetti.»':' fa una smorfia e si allontana.'),ok?'var(--green)':'var(--red)');}
    else log(npc.name+(o.r<0?' alza le mani: «Scusa.»':' annuisce.'),'var(--dim)');return;}
  if(g.kind==='deep'){if(i<0){log(npc.name+' resta in silenzio accanto a te.','var(--dim)');return;}
    const o=g.d.o[i];npc.rel=clamp(npc.rel+o.r,-100,100);S.mh=Math.min(100,S.mh+o.m);
    if(o.n)setTimeout(()=>{if(S&&S.mode==='play'&&!S.dlg&&!S.qte&&npc.alive&&!npc.leaving)openDlg(npc,DEEP[o.n],'deep');},1800);
    else log(npc.name+' ti stringe la spalla, senza dire niente.','var(--green)');
    return;}
  npc.stage++;
  if(i<0){npc.rel-=5;log('Ignori '+npc.name+'. Si allontana in silenzio.','var(--dim)');return;}
  const o=g.d.o[i],before=relLabel(npc.rel);npc.rel=clamp(npc.rel+o.r,-100,100);
  if(o.s)S.st=clamp(S.st+o.s,0,S.maxSt);if(o.r>0)S.mh=Math.min(100,S.mh+o.r/4);
  log(npc.name+(o.r>5?' sorride.':o.r<0?' ti guarda storto.':' annuisce.')+(o.s?` (stamina ${o.s>0?'+':''}${o.s})`:''),o.r>0?'var(--green)':o.r<0?'var(--red)':'var(--dim)');
  const after=relLabel(npc.rel);
  if(after!==before&&(after==='Amico'||after==='Rivale'))log(npc.name+(after==='Amico'?' ora è tuo amico.':' ora è tuo rivale.'),after==='Amico'?'var(--green)':'var(--red)');
  if(after!==before&&after==='Fraterno'){S.bro=true;npc.buddy=pick([-5,-4,4,5]);npc.lane=pick([2,3]);log(npc.name+' ora è come un fratello per te.','var(--green)');}
  if(after!==before&&after==='Odio mortale'){S.hate=true;log(npc.name+' ti odia a morte.','var(--red)');}
}
const isHeat=()=>{const h=hourNow(),w=S.wx.heat;return !!w&&h>=w[0]&&h<w[1];};
function randomEvent(){
  const heat=isHeat(),wx=S.wx;
  const ev=[['crampo',2+(S.hy<40?3:0)],['caduta',2+(S.st<30?2:0)],['sasso',1.6],['acqua',1.4+(heat?1.5:0)],['salita',1.1*wx.hill*(S.zplan&&S.zplan[S.zi].z==='montagna'?2.2:1)],['pioggia',.9*wx.rain],['isteria',S.mh<35?3.5:0]];
  let r=Math.random()*ev.reduce((a,e)=>a+e[1],0),ch='crampo';for(const e of ev){r-=e[1];if(r<=0){ch=e[0];break;}}
  if(ch==='salita'){S.hillLen=Math.random()<.5?rand(12,18):rand(28,42);S.hill=S.hillLen;log(S.hillLen>25?'Inizia una lunga salita.':'Una salita.','var(--amber)');}
  else if(ch==='pioggia'){S.rain=35;S.thunder=1.2;sfx.thunder();log('Un tuono. Poi la pioggia.','var(--amber)');}
  else if(ch==='sasso')choice('SASSO NELLA SCARPA','Un sasso ti si è infilato nella scarpa. Ogni passo è una lama.',[
     {l:'Fermati a toglierlo (richiamo sicuro)',f:()=>{addWarn();log('Togli il sasso. Il soldato prende nota.','var(--red)');}},
     {l:'Tienilo e stringi i denti',f:()=>{S.st=Math.max(0,S.st-12);S.stone=60;log('Tieni il sasso. Il piede pulsa.','var(--red)');}}],8,1);
  else startQTE(ch);
}

/* ================= LOGICA ================= */
const hourNow=()=>7+S.t/60; // 1 minuto reale = 1 ora di gioco
function update(dt){
  S.t+=dt;const sh=S.sh,hour=hourNow(),heat=isHeat(),wx=S.wx;
  let cap=5.2+5*Math.pow(S.st/100,.6)*(.6+.4*S.ph/100);
  if(S.peeing>0){cap=Math.min(cap,6.9);S.peeing-=dt;if(S.peeing<=0){S.bl=0;S.mh-=3;log('Fatto. Nessuno ci fa caso. Quasi.','var(--dim)');}}
  if(S.qte&&S.qte.type==='blocco')cap=0;
  const k=K*(S.hill>0?.78:S.desc>0?1.05:1)*(S.rain>0?.94:1)*(S.injury?.95:1);
  S.speed+=(Math.min(cadence()*k,cap)-S.speed)*Math.min(1,dt*2.5);
  S.anim+=S.speed*dt*.6;S.scroll+=S.speed*dt*4;S.km+=S.speed*dt/60;
  S.maxSt=Math.max(40,100-S.t*.06);
  let d=(.12+Math.max(0,S.speed-LIMIT)*.22)*sh.st;if(S.hill>0)d*=1.9;if(S.speed<LIMIT)d-=Math.min(2,(LIMIT-S.speed)*.6);
  S.st=clamp(S.st-d*dt,0,S.maxSt);
  S.hy=clamp(S.hy-.11*wx.hyd*(heat?2:1)*(S.hill>0?1.4:1)*dt,0,100);
  S.bl=clamp(S.bl+.045*dt,0,100);S.sto=Math.max(0,S.sto-.4*dt);S.drinkCd-=dt;
  if(S.bl>=100){S.bl=0;S.mh-=25;sfx.bad();buzz(300);log('Non ce l\'hai fatta a trattenerla. Ti sei bagnato davanti a tutti.','var(--red)');}
  if(heat&&!S.heatMsg){S.heatMsg=true;log('Il sole picchia. L\'asfalto brucia.','var(--amber)');}
  if(wx.cold&&hour>=20&&!S.coldMsg){S.coldMsg=true;log('Scende la notte. Fa freddo, molto freddo.','var(--blue)');}
  if(heat&&S.hy<15&&Math.random()<dt*.08){S.ph-=15;S.mh-=10;S.speed-=2;log('Colpo di calore. Il mondo gira.','var(--red)');sfx.bad();}
  if(!S.blister&&sh.blister&&S.t>sh.blister){S.blister=true;log('Senti le vesciche aprirsi nelle scarpe.','var(--red)');}
  if(!S.broken&&S.t>S.breakAt){S.broken=true;log('La suola dei mocassini si stacca.','var(--red)');}
  let pd=.03*sh.ph;if(S.hy<25)pd+=.15;if(S.blister)pd+=.06;if(S.broken)pd+=.12;if(S.stone>0){pd+=.07;S.stone-=dt;}if(S.injury)pd+=.05;if(wx.cold&&hour>=20)pd+=.03;
  S.ph=clamp(S.ph-pd*dt,0,100);
  let md=.05*sh.mh*(1.3-S.tr.n/100);if(S.bl>70)md+=.08;if(hour>=20)md+=wx.cold?.08:.05;md+=.03*S.warn;if(S.radio)md*=.7;if(S.watch)md*=.85;if(S.zplan&&S.zplan[S.zi].z==='mare')md*=.45;
  S.mh=clamp(S.mh-md*dt,0,100);
  const lp=lvl(S.ph),lm=lvl(S.mh);S.thT-=dt;
  if(lp>S.lvPH){think('ph');S.thT=rand(12,18);}else if(lm>S.lvMH){think('mh');S.thT=rand(12,18);}
  else if(S.thT<=0){think(lm>=lp?'mh':'ph');S.thT=rand(14,22);}
  S.lvPH=lp;S.lvMH=lm;
  if(!S.food9&&hour>=9){S.food9=true;S.tub=5;log('Ore 9: i soldati distribuiscono i cinturoni. 5 tubetti di cibo.','var(--green)');sfx.good();}
  if(S.t>5&&S.speed<LIMIT&&!(S.qte&&S.qte.type==='blocco')){S.underT+=dt;if(S.underT>=3){S.underT=0;addWarn();}}else S.underT=Math.max(0,S.underT-dt*2);
  S.truckX+=((4+S.underT*9)-S.truckX)*Math.min(1,dt*3);
  if(S.underT>.5){S.heartT-=dt;if(S.heartT<=0){sfx.heart();S.heartT=.9-S.underT*.2;}}

const MW=160,MH=135,MK=MW/(73*.616);
const proj=([lo,la])=>[(lo+11)*.616*MK,(72-la)*MK];
let MAPBASE=null;
function buildMap(){
  const c=document.createElement('canvas');c.width=MW;c.height=MH;const g=c.getContext('2d');
  g.fillStyle='#000';g.fillRect(0,0,MW,MH);
  const poly=(pts,col)=>{g.fillStyle=col;g.beginPath();pts.forEach((p,i)=>{const[x,y]=proj(p);i?g.lineTo(x,y):g.moveTo(x,y);});g.closePath();g.fill();};
  LAND.forEach(p=>poly(p,'#fff'));SEA.forEach(p=>poly(p,'#000'));
  const d=g.getImageData(0,0,MW,MH),a=d.data,land=new Uint8Array(MW*MH);
  for(let i=0;i<MW*MH;i++)land[i]=a[i*4]>127?1:0;
  for(let y=0;y<MH;y++)for(let x=0;x<MW;x++){const i=y*MW+x,o=i*4;let col;
    if(land[i]){const coast=(x>0&&!land[i-1])||(x<MW-1&&!land[i+1])||(y>0&&!land[i-MW])||(y<MH-1&&!land[i+MW]);col=coast?[58,46,38]:((x*3+y*5)%11===0?[118,104,78]:[104,92,70]);}
    else col=(x+y*2)%9===0?[34,52,72]:[26,40,58];
    a[o]=col[0];a[o+1]=col[1];a[o+2]=col[2];a[o+3]=255;}
  g.putImageData(d,0,0);
  g.fillStyle='rgba(255,255,255,.05)';for(let x=0;x<MW;x+=16)g.fillRect(x,0,1,MH);for(let y=0;y<MH;y+=16)g.fillRect(0,y,MW,1);
  MAPBASE=c;
}
function drawMap(c,prog){
  if(!MAPBASE)buildMap();const g=c.getContext('2d');g.imageSmoothingEnabled=false;g.drawImage(MAPBASE,0,0);
  const pts=ROUTE.c.map(n=>proj(CITY[n]));
  let segs=[],tot=0;for(let i=1;i<pts.length;i++){const l=Math.hypot(pts[i][0]-pts[i-1][0],pts[i][1]-pts[i-1][1]);segs.push(l);tot+=l;}
  let left=tot*prog,step=0;
  for(let i=1;i<pts.length&&left>0;i++){const[a,b]=[pts[i-1],pts[i]],l=segs[i-1],n=Math.ceil(l);
    for(let k=0;k<=n&&left>0;k++,left-=l/n,step++){if(step%3===2)continue;const t=k/n;g.fillStyle='#e0483a';g.fillRect(Math.round(a[0]+(b[0]-a[0])*t),Math.round(a[1]+(b[1]-a[1])*t),1,1);}}
  pts.forEach(([x,y],i)=>{const on=tot*prog>=segs.slice(0,i).reduce((s,v)=>s+v,0)-.5;if(!on)return;g.fillStyle='#000';g.fillRect(Math.round(x)-2,Math.round(y)-2,4,4);g.fillStyle=i===0?'#86b85e':i===pts.length-1?'#e8a838':'#f4ecd0';g.fillRect(Math.round(x)-1,Math.round(y)-1,2,2);});
  if(prog>=1){const lab=(n,[x,y],col)=>{const s=n.toUpperCase().replace(/[^A-Z ]/g,''),w=s.length*4;let lx=clamp(Math.round(x)-w/2,1,MW-w-1),ly=y<14?Math.round(y)+4:Math.round(y)-8;g.fillStyle='rgba(0,0,0,.6)';g.fillRect(lx-1,ly-1,w+1,7);ptextC(g,s,lx,ly,col);};
    lab(ROUTE.c[0],pts[0],'#a8e07e');lab(ROUTE.c[ROUTE.c.length-1],pts[pts.length-1],'#f8c858');}
}

}
function loading(shoe){
  show(`<h2>PARTENZA DA ${ROUTE.c[0].toUpperCase()} · ${YEAR}</h2><p style="font-size:16px;max-width:420px">${pick(TIPS)}</p><p class="lbl">— Manuale del Marciatore, ed. ${YEAR}</p><button class="main" id="go">INIZIA</button>`);
  $('go').addEventListener('click',()=>{sc.className='hide';if(shoe==='running')shoe='tennis';newRun(shoe,PROFILE);});
}
function end(win){
  if(!S||S.mode==='over')return;S.mode='over';hideBox();
  const best=store.get('up_best3',0);if(S.t>best)store.set('up_best3',S.t);
  const runsN=store.get('up_runs',0)+1;store.set('up_runs',runsN);
  let unlockMsg='';
  {const posE=S.npcs.filter(n=>n.alive&&!n.leaving).length+1,ends=store.get('up_ends',{});
   const tags=[win?'vittoria':posE===TOTAL?'primo_morto':posE===2?'penultimo':null,S.panicDeath?'panico':null].filter(Boolean);tags.forEach(tag=>ends[tag]=(ends[tag]||0)+1);store.set('up_ends',ends);
   const unZ=store.get('up_unlock',{});if(runsN>=ZAINO_RUNS&&!unZ.zainetto){unZ.zainetto=true;store.set('up_unlock',unZ);unlockMsg+='<p style="color:var(--amber)">🔓 Sbloccato: Zainetto — ora porti 2 oggetti</p>';}
   const deadN=S.npcs.filter(n=>!n.alive||n.leaving).length;
   const U=(k,cond,msg)=>{if(cond&&!unZ[k]){unZ[k]=true;store.set('up_unlock',unZ);unlockMsg+='<p style="color:var(--amber)">🔓 '+msg+'</p>';}};
   U('hamburger',S.bro,'Sbloccato: Hamburger crudo');U('panini',S.hate,'Sbloccati: Panini burro e marmellata');U('orologio',!win&&deadN>=Math.ceil(S.npcs.length/2),'Sbloccato: Orologio del padre');
   if(S.panicDeath&&!unZ.radio){unZ.radio=true;store.set('up_unlock',unZ);unlockMsg+='<p style="color:var(--amber)">🔓 Sbloccata: Radio portatile</p>';}}
  if(win){const un=store.get('up_unlock',{});if(!un.trekking){un.trekking=true;store.set('up_unlock',un);unlockMsg+='<p style="color:var(--amber)">🔓 Sbloccati: Scarponi da trekking</p>';}}
  const K2=store.get('up_know',{}),un2=store.get('up_unlock',{});let tipMsg='';
  K2[S.shoe]=K2[S.shoe]||{};
  if(!K2[S.shoe].con){K2[S.shoe].con=true;tipMsg+=`<p>👟 Ora conosci il difetto di <b>${SHOES[S.shoe].n}</b>: ${SHOES[S.shoe].con}</p>`;}
  const cand=Object.keys(SHOES).filter(k=>k!=='running'&&!(K2[k]&&K2[k].pro)&&(!SHOES[k].unlock||un2[k]));
  if(cand.length){const k=pick(cand);K2[k]=K2[k]||{};K2[k].pro=true;tipMsg+=`<p>💡 Suggerimento: <b>${SHOES[k].n}</b> — ${SHOES[k].pro}</p>`;}
  store.set('up_know',K2);
  const pos=S.npcs.filter(n=>n.alive&&!n.leaving).length+1,hrs=Math.floor(S.t/60),mins=Math.floor(S.t%60);
  const rows=S.npcs.filter(n=>n.named).map(n=>`<tr><td>${n.name}</td><td style="color:${relColor(n.rel)}">${relLabel(n.rel)}</td><td class="lbl">${n.alive&&!n.leaving?'in marcia':'morto'}</td></tr>`).join('');
  const t=S.tr,trait=v=>v>=62?'alto':v<=38?'basso':'medio';
  show(`<h1 style="color:${win?'var(--green)':'var(--red)'}">${win?'LA GRAZIA':'FINE'}</h1><h2>${win?'Sei l\'ultimo rimasto sulla strada.':S.cause}</h2>
  <p>Marcia del ${YEAR} (${ROUTE.c[0]} → ${ROUTE.c[ROUTE.c.length-1]}) · N.${S.bib} · <b>${hrs} ore ${mins} min</b> · <b>${fmt(S.km)} km</b> · posizione <b>${pos}ª</b>/${TOTAL}${S.t>best?' · <span style="color:var(--amber)">record</span>':''}</p>
  ${unlockMsg}${tipMsg}<table>${rows}</table>
  <p class="lbl" style="font-size:11px">Profilo nascosto — fisico ${trait(t.f)}, nervi ${trait(t.n)}, stomaco ${trait(t.s)}, carisma ${trait(t.c)}</p>
  <div class="row2"><button class="ghost" id="home">SCHERMATA PRINCIPALE</button><button class="main" id="go">PROSSIMA MARCIA</button></div>`);
  $('go').addEventListener('click',mapScreen);
  $('home').addEventListener('click',()=>{const c=$('chatb'),d=$('chatd');if(c)c.style.display='none';if(d)d.style.display='none';titleScreen();});
}

/* ================= ORIENTAMENTO ================= */
let rotOk=false;
let lastTurn=null;
function checkRot(){const portrait=window.innerHeight>window.innerWidth*1.05,turn=portrait&&!rotOk;app.classList.toggle('turn',turn);$('rot').classList.remove('on');
  if(turn!==lastTurn){lastTurn=turn;requestAnimationFrame(()=>{fit();if(sc.classList.contains('title')){const t=$('tcv');if(t)drawTitleArt(t);}});}}
$('rotOk').addEventListener('click',()=>{rotOk=true;checkRot();});
const toastEl=document.createElement('div');toastEl.id='toast';app.appendChild(toastEl);
function toast(m,ms=3500){toastEl.textContent=m;toastEl.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>toastEl.style.display='none',ms);}
async function goFull(){
  const el=document.documentElement;let ok=false;
  try{if(el.requestFullscreen){await el.requestFullscreen({navigationUI:'hide'});ok=true;}else if(el.webkitRequestFullscreen){el.webkitRequestFullscreen();ok=true;}}catch(e){}
  if(ok){try{await screen.orientation.lock('landscape');rotOk=true;checkRot();}catch(e){}}
  else toast('Qui dentro Claude lo schermo intero non è permesso. Gira il telefono: il gioco si mette in orizzontale da solo. Per lo schermo intero vero usa la versione installabile.',6000);
}
$('fsHud').addEventListener('click',goFull);
window.__goFull=goFull;
window.addEventListener('resize',()=>{checkRot();fit();if(sc.classList.contains('title')){const t=$('tcv');if(t)drawTitleArt(t);}});
checkRot();

/* ================= LOOP ================= */
const ERR=document.createElement('div');ERR.style.cssText='position:absolute;left:0;right:0;top:0;z-index:30;background:#7a1010;color:#fff;font-size:11px;padding:6px;display:none;white-space:pre-wrap';app.appendChild(ERR);
function showErr(e){ERR.style.display='block';ERR.textContent='ERRORE (mandami uno screenshot): '+((e&&(e.message||e))||'sconosciuto')+(e&&e.stack?'\n'+String(e.stack).split('\n').slice(0,3).join('\n'):'');}
window.addEventListener('error',e=>showErr(e.error||e.message));
let last=performance.now();
function frame(){
  const now=performance.now(),dt=clamp((now-last)/1000,0,.1);last=now;
  try{
    if(S){
      if(!isFinite(S.speed))S.speed=0;
      if(S.mode==='play'){update(dt);hud();}
      else if(S.mode==='count'){countdown(dt);hud();}
      else if(S.mode==='dying'){S.t+=dt*.2;if(S.flash){S.flash.t-=dt;if(S.flash.t<=0)S.flash=null;}}
      drawWorld();
    }
  }catch(e){showErr(e);}
  requestAnimationFrame(frame);
}
document.addEventListener('visibilitychange',()=>{last=performance.now();});
fit();titleScreen();
requestAnimationFrame(frame);
})();
</script>
<script>if("serviceWorker" in navigator){window.addEventListener("load",()=>{navigator.serviceWorker.register("sw.js").catch(()=>{});});}</script>
